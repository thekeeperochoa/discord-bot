<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#07060F">
<title>Degen Kart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060F; --ink:#F7F3FF; --muted:#B9B2D3; --faint:#8A82A8; --rule:rgba(185,178,211,.18);
  --gold:#FFD23F; --gold2:#FFB21F; --pink:#FF3D9A; --cyan:#3DE0FF; --green:#39E58C; --red:#FF4D6D; --violet:#8B5CFF;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --disp:"Bungee","Impact",system-ui,sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{color:var(--ink);font:400 15px/1.45 "IBM Plex Sans",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent;touch-action:none;-webkit-user-select:none;user-select:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:8px}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ── HUD ── */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--disp)}
.hud-tl{position:absolute;left:14px;top:calc(10px + var(--safe-t));display:flex;flex-direction:column;gap:6px}
.place{font-size:58px;line-height:.9;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.45),0 0 22px rgba(255,210,63,.55)}
.place sup{font-size:.42em;vertical-align:top;margin-left:2px}
.place.p1{color:var(--gold)}
.lap{font-size:17px;letter-spacing:.04em;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.timer{font:600 16px/1 var(--mono);color:var(--muted);text-shadow:0 1px 0 #000}
.board{margin-top:6px;display:flex;flex-direction:column;gap:2px;font:600 12px/1.25 "IBM Plex Sans",sans-serif}
.board div{display:flex;align-items:center;gap:6px;padding:2px 8px 2px 4px;border-radius:6px;background:rgba(7,6,15,.45);width:max-content;max-width:170px;transition:transform .25s}
.board i{width:10px;height:10px;border-radius:3px;flex:none}
.board b{width:14px;text-align:right;font-family:var(--mono);color:var(--muted)}
.board span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .me{background:rgba(255,210,63,.28);outline:1px solid rgba(255,210,63,.6)}
.board .me b{color:#fff}
.board .fin span::after{content:" 🏁"}
.hud-tr{position:absolute;right:14px;top:calc(10px + var(--safe-t));display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.item{width:78px;height:78px;border-radius:18px;display:grid;place-items:center;font-size:42px;
  background:radial-gradient(circle at 50% 35%,rgba(255,255,255,.22),rgba(255,255,255,.05) 60%),rgba(7,6,15,.55);
  box-shadow:inset 0 0 0 3px rgba(255,210,63,.75),0 6px 20px rgba(0,0,0,.45)}
.item.rolling{animation:roll .09s steps(1) infinite}
.item.ready{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 3px #fff,0 0 26px rgba(255,210,63,.9)}}
.item-name{font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-shadow:0 1px 0 #000}
#mini{position:absolute;left:12px;bottom:calc(12px + var(--safe-b));width:150px;height:150px;border-radius:16px;background:rgba(7,6,15,.72);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.speed{position:absolute;right:16px;bottom:calc(14px + var(--safe-b));text-align:right;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.speed b{font-size:40px;line-height:1}
.speed small{display:block;font:600 11px/1 "IBM Plex Sans",sans-serif;letter-spacing:.1em;color:var(--muted)}
.drift-meter{position:absolute;left:50%;bottom:calc(26px + var(--safe-b));transform:translateX(-50%);width:180px;height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;opacity:0;transition:opacity .2s}
.drift-meter.on{opacity:1}
.drift-meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3DE0FF,#FFB21F 70%,#FF4D6D)}
.center{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none}
.count{font-size:120px;line-height:1;color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.4),0 0 40px rgba(255,210,63,.6);animation:pop .9s ease-out both}
.count.go{color:var(--green)}
@keyframes pop{0%{transform:scale(2.2);opacity:0}25%{transform:scale(1);opacity:1}80%{opacity:1}100%{transform:scale(.8);opacity:0}}
.banner{display:inline-block;font-size:30px;padding:10px 22px;border-radius:14px;background:rgba(7,6,15,.65);box-shadow:0 0 0 2px rgba(255,210,63,.6);animation:pop 2.4s ease-out both}
.warn{color:var(--red)}
.lights{display:flex;gap:12px;justify-content:center;margin-bottom:14px}
.lights i{width:30px;height:30px;border-radius:50%;background:#222;box-shadow:inset 0 0 0 3px #000}
.lights i.r{background:#FF3B30;box-shadow:0 0 18px #FF3B30}
.lights i.g{background:#39E58C;box-shadow:0 0 18px #39E58C}
.lights.gone{animation:fadeout .5s .9s ease-in both}
@keyframes fadeout{to{opacity:0;transform:translateY(-10px)}}
.netbad{position:absolute;top:calc(44px + var(--safe-t));left:50%;transform:translateX(-50%);font:600 12px/1 "IBM Plex Sans",sans-serif;padding:6px 10px;border-radius:99px;background:rgba(255,77,109,.85)}
.pausebtn{position:absolute;left:50%;top:calc(8px + var(--safe-t));transform:translateX(-50%);pointer-events:auto;border:0;border-radius:99px;
  padding:6px 12px;background:rgba(7,6,15,.5);font:600 12px/1 "IBM Plex Sans",sans-serif;letter-spacing:.06em;cursor:pointer}

/* ── touch controls ── */
#touch{position:fixed;inset:auto 0 0 0;height:46%;pointer-events:none}
#touch button{position:absolute;pointer-events:auto;border:0;border-radius:50%;display:grid;place-items:center;touch-action:none;
  background:rgba(10,8,25,.42);box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);font-family:var(--disp);color:#fff;text-shadow:0 1px 2px #000;-webkit-user-select:none;user-select:none}
#touch button.on{background:rgba(255,210,63,.42);box-shadow:inset 0 0 0 2px var(--gold)}
#t-left,#t-right{width:84px;height:84px;bottom:calc(26px + var(--safe-b));font-size:30px}
#t-left{left:16px} #t-right{left:112px}
#t-brake{width:62px;height:62px;right:132px;bottom:calc(24px + var(--safe-b));font-size:11px}
#t-drift{width:86px;height:86px;right:20px;bottom:calc(24px + var(--safe-b));font-size:12px}
#t-item{width:66px;height:66px;right:40px;bottom:calc(124px + var(--safe-b));font-size:11px}
body.touch #mini{left:auto;right:14px;bottom:auto;top:calc(122px + var(--safe-t));width:100px;height:100px}
@media (max-height:500px){ body.touch #mini{top:calc(108px + var(--safe-t));width:88px;height:88px} #t-item{bottom:calc(112px + var(--safe-b))} .item{width:64px;height:64px;font-size:34px} }
body.touch .speed{display:none}
/* tall, narrow phones: stack BRAKE and ITEM above DRIFT so nothing overlaps the steering arrows */
@media (max-width:520px) and (min-height:501px){
  #t-left,#t-right{width:78px;height:78px} #t-right{left:102px}
  #t-brake{right:26px;bottom:calc(122px + var(--safe-b))}
  #t-item{right:104px;bottom:calc(100px + var(--safe-b))}
}
@media (max-width:360px) and (min-height:501px){ #t-left,#t-right{width:70px;height:70px} #t-left{left:10px} #t-right{left:88px} #t-item{right:100px} }

/* ── menus ── */
#menu{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  background:linear-gradient(180deg,rgba(7,6,15,.55),rgba(7,6,15,.2) 30%,rgba(7,6,15,.75))}
.mwrap{max-width:980px;margin:0 auto;padding:calc(14px + var(--safe-t)) 16px calc(40px + var(--safe-b))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px}
.top a{color:var(--muted);text-decoration:none} .top a:hover{color:#fff}
.top .bal{color:var(--muted)} .top .bal b{color:var(--ink);font-family:var(--mono)}
.logo{margin:28px 0 6px;text-align:center}
.logo h1{margin:0;font:400 clamp(44px,11vw,96px)/.9 var(--disp);letter-spacing:.02em;
  background:linear-gradient(180deg,#FFF6C8 0%,#FFD23F 45%,#FF8A1F 80%,#FFE38A 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 4px 0 #5A2A00) drop-shadow(0 0 26px rgba(255,170,40,.45));transform:skewX(-8deg)}
.logo p{margin:8px 0 0;color:var(--muted);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:26px 0 18px}
.mbtn{position:relative;overflow:hidden;text-align:left;border:0;cursor:pointer;border-radius:18px;padding:18px 18px 16px;min-height:118px;
  background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12),0 14px 34px rgba(0,0,0,.4);
  transition:transform .18s,box-shadow .18s;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.mbtn:hover{transform:translateY(-3px);box-shadow:inset 0 0 0 1px rgba(255,210,63,.6),0 18px 40px rgba(0,0,0,.5)}
.mbtn .ic{font-size:30px}
.mbtn h3{margin:6px 0 2px;font:400 19px/1.1 var(--disp);letter-spacing:.02em}
.mbtn p{margin:0;color:var(--muted);font-size:13.5px}
.mbtn.hero{background:linear-gradient(150deg,rgba(255,210,63,.32),rgba(255,138,31,.16));box-shadow:inset 0 0 0 1px rgba(255,210,63,.55),0 14px 34px rgba(0,0,0,.45)}
.panel{border-radius:18px;padding:16px;background:rgba(10,9,22,.78);box-shadow:inset 0 0 0 1px var(--rule),0 16px 40px rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.panel h2{margin:0 0 10px;font:400 18px/1.1 var(--disp);letter-spacing:.02em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.row2{grid-template-columns:1fr}}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stats div b{display:block;font:600 22px/1.1 var(--mono)}
.stats div span{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04)}
.list li .dot{width:12px;height:12px;border-radius:4px;flex:none}
.list li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li .r{font-family:var(--mono);color:var(--muted);font-size:13px}
.list li.you{background:rgba(255,210,63,.14)}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tab{border:0;border-radius:99px;padding:6px 12px;background:rgba(255,255,255,.07);cursor:pointer;font-size:13px}
.tab[aria-pressed="true"]{background:var(--gold);color:#140C00;font-weight:600}
.tracks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.trk{border:0;cursor:pointer;border-radius:16px;padding:0;overflow:hidden;text-align:left;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1);transition:transform .15s}
.trk:hover{transform:translateY(-2px)}
.trk[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--gold),0 0 24px rgba(255,210,63,.35)}
.trk canvas{display:block;width:100%;height:120px}
.trk div{padding:8px 12px 10px}
.trk h4{margin:0;font:400 15px/1.2 var(--disp)}
.trk small{color:var(--muted)}
.form{display:grid;gap:12px;margin-top:14px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.field label{color:var(--muted);font-size:14px}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.06);border-radius:12px;padding:3px}
.seg button{border:0;background:none;border-radius:9px;padding:6px 12px;cursor:pointer;font-family:var(--mono)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#140C00;font-weight:600}
.inp{background:rgba(255,255,255,.07);border:0;border-radius:10px;padding:9px 12px;min-width:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.inp:focus{outline:none;box-shadow:inset 0 0 0 2px var(--cyan)}
.go{border:0;cursor:pointer;border-radius:14px;padding:14px 22px;font:400 18px/1 var(--disp);letter-spacing:.03em;color:#170D00;
  background:linear-gradient(180deg,#FFE58A,#FFB21F);box-shadow:0 5px 0 #9A5A00,0 12px 26px rgba(255,178,31,.3);transition:transform .12s,box-shadow .12s}
.go:hover{transform:translateY(-2px)} .go:active{transform:translateY(3px);box-shadow:0 2px 0 #9A5A00}
.go[disabled]{filter:grayscale(.8) brightness(.7);cursor:not-allowed;transform:none}
.ghost{border:0;cursor:pointer;border-radius:12px;padding:10px 16px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.ghost:hover{background:rgba(255,255,255,.14)}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{border:0;background:none;cursor:pointer;color:var(--muted);padding:6px 0;margin:10px 0}
.back:hover{color:#fff}
.code{font:600 30px/1 var(--mono);letter-spacing:.18em;color:var(--gold)}
.muted{color:var(--muted)} .small{font-size:13px}
.err{color:var(--red);min-height:1.4em;margin:6px 0 0;font-size:14px}
.res li .pl{font:400 18px/1 var(--disp);width:34px;text-align:center}
.res li.p1 .pl{color:var(--gold)} .res li.p2 .pl{color:#D7DCE6} .res li.p3 .pl{color:#E09A5B}
.res li .paid{color:var(--green);font-weight:600}
.howto{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.howto div{padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05)}
.howto b{display:block;font-family:var(--disp);font-weight:400;margin-bottom:2px}
.kbd{display:inline-block;font:600 12px/1 var(--mono);padding:4px 6px;border-radius:6px;background:rgba(255,255,255,.12);box-shadow:inset 0 -2px 0 rgba(0,0,0,.4)}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:rgba(20,18,40,.95);box-shadow:0 0 0 1px var(--rule);z-index:30;max-width:90vw;text-align:center}
.fatal{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--bg);z-index:40}
.memlist li{cursor:default}
.memlist img{width:26px;height:26px;border-radius:50%}
.badge{font:600 10.5px/1 "IBM Plex Sans";letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:99px;background:rgba(255,255,255,.1);color:var(--muted)}
.badge.gold{background:rgba(255,210,63,.2);color:var(--gold)}
.badge.green{background:rgba(57,229,140,.18);color:var(--green)}
/* garage */
.garage{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.garage{grid-template-columns:1fr}}
.gview{position:relative;border-radius:22px;overflow:hidden;min-height:380px;
  background:radial-gradient(120% 90% at 50% 15%,rgba(255,210,63,.28),transparent 55%),radial-gradient(90% 70% at 50% 110%,rgba(139,92,255,.4),transparent 70%),linear-gradient(180deg,#1B1338,#0B0820);
  box-shadow:inset 0 0 0 2px rgba(255,210,63,.35),0 18px 40px rgba(0,0,0,.45)}
.gview::before{content:"";position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 0%,rgba(255,255,255,.05) 0 6deg,transparent 6deg 18deg);pointer-events:none}
#gPrev{display:block;width:100%;height:330px;position:relative}
.gname{position:absolute;left:18px;top:14px;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.gname span{display:block;font:400 26px/1.05 var(--disp);color:#fff}
.gname small{color:var(--muted);font-size:13px}
.sbars{position:relative;padding:4px 18px 16px;display:grid;gap:7px}
.sb{display:grid;grid-template-columns:104px 1fr;align-items:center;gap:10px;font:600 12px/1 "IBM Plex Sans";letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sb .track{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sb i{height:12px;border-radius:3px;background:rgba(255,255,255,.1);transform:skewX(-14deg);transition:background .3s}
.sb i.on{background:linear-gradient(180deg,#FFE58A,#FFB21F)}
.sb i.up{background:linear-gradient(180deg,#8CFFB8,#39E58C)} .sb i.down{background:rgba(255,77,109,.55)}
.gpick{min-width:0}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px;max-height:62vh;overflow-y:auto;padding:2px}
.gcard{position:relative;border:0;cursor:pointer;border-radius:16px;padding:8px 8px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:transform .15s,box-shadow .15s}
.gcard:hover{transform:translateY(-2px)}
.gcard.on{box-shadow:inset 0 0 0 3px var(--gold),0 0 22px rgba(255,210,63,.35);background:linear-gradient(180deg,rgba(255,210,63,.22),rgba(255,210,63,.05))}
.gcard img{width:96px;height:96px;object-fit:contain}
.gcard .sw{width:64px;height:64px;border-radius:50%;margin:16px 0;box-shadow:inset 0 0 0 3px rgba(255,255,255,.35),0 6px 14px rgba(0,0,0,.4)}
.gcard b{font:400 13px/1.15 var(--disp);letter-spacing:.02em}
.gcard small{color:var(--muted);font-size:11px}
.gcard em{font-style:normal;font-size:11px;color:var(--gold);line-height:1.25;margin-top:2px}
.gcard.locked img{filter:brightness(0) drop-shadow(0 0 1px rgba(255,255,255,.5));opacity:.75}
.gcard.locked .sw{filter:grayscale(.6) brightness(.5)}
.garage-card{padding-right:120px}
.garage-card img{position:absolute;right:-6px;bottom:-10px;width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
.emo{width:20px;text-align:center}
.board em{font-style:normal;font-size:12px}
.unlocks{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.unl{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:14px;background:linear-gradient(135deg,rgba(255,210,63,.3),rgba(255,138,31,.12));box-shadow:inset 0 0 0 2px rgba(255,210,63,.6);animation:unl .7s cubic-bezier(.2,1.6,.4,1) both}
.unl img,.unl .swb{width:56px;height:56px;border-radius:10px;object-fit:contain;display:block}
.unl small{display:block;font:600 10px/1 "IBM Plex Sans";letter-spacing:.12em;color:var(--gold)}
.unl b{font:400 16px/1.2 var(--disp)}
@keyframes unl{from{transform:scale(.4);opacity:0}}
#menu.cer{background:linear-gradient(90deg,rgba(7,6,15,0) 0%,rgba(7,6,15,.15) 40%,rgba(7,6,15,.72))}
@media (min-width:900px){#menu.cer .resultpanel{max-width:520px;margin-left:auto}}
@media (max-width:899px){#menu.cer .resultpanel{margin-top:42vh!important}}
.finish{display:inline-flex;flex-direction:column;align-items:center;gap:4px;animation:pop 3s ease-out both}
.finish b{font:400 84px/1 var(--disp);letter-spacing:.04em;transform:skewX(-10deg);
  background:repeating-linear-gradient(45deg,#fff 0 14px,#111 14px 28px);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:2px #fff;filter:drop-shadow(0 5px 0 rgba(0,0,0,.5))}
.finish span{font:400 34px/1 var(--disp);color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.5)}
</style>
</head>
<body>
<canvas id="gl" aria-label="Race view"></canvas>
<div id="hud" hidden>
  <div class="hud-tl">
    <div class="place" id="hPlace">1<sup>st</sup></div>
    <div class="lap" id="hLap">LAP 1/3</div>
    <div class="timer" id="hTime">0:00.00</div>
    <div class="board" id="hBoard"></div>
  </div>
  <div class="hud-tr">
    <div class="item" id="hItem"></div>
    <div class="item-name" id="hItemName">&nbsp;</div>
  </div>

(function(){

// ── basics ────────────────────────────────────────────────────────────────────
var $ = function(id){ return document.getElementById(id); };

var BAL = null;

    headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})})
    .then(function(r){ if (r.status === 401){ location.href = "/auth/login"; throw new Error("login"); } return r.json(); })

// ── physics constants (m, s) ──────────────────────────────────────────────────
var VMAX = 27, VBOOST = 37, VOFF = 13, VREV = -8, ACC = 26, BRAKE = 38, COAST = 5;
var BASE_P = {vmax: 27, acc: 26, turn: 1, weight: 3, voff: 13, boost: 0};
// the garage catalog (from the server) turns a look into stats: [speed, accel, handling, weight], each 1–6
var CAT = null;
function lookStats(look){

  var st = ((CAT.c[look.c] || CAT.c.wolf).st || [3, 3, 3, 3]).slice();
  [CAT.b[look.b], CAT.w[look.w]].forEach(function(p){ if (p) p.mod.forEach(function(m, i){ st[i] += m; }); });

}
function kartParams(look){

var GRASS = 3.5;          // grass strip between the road edge and the wall
var KART_R = 0.85;        // collision radius
var ITEMS = {
  nitro:  {name: "Nitro", icon: "⚡"},
  banana: {name: "Banana Peel", icon: "🍌"},
  shot:   {name: "Margin Call", icon: "📉"},
  shield: {name: "Golden Parachute", icon: "🪂"}
};
var ITEM_KEYS = Object.keys(ITEMS);
var SHOT_SPEED = 48, SHOT_LIFE = 9;

// ── tracks ────────────────────────────────────────────────────────────────────
// The server sends each track's centre line sampled every ~2 m as (x, z, height).
var THEMES = {
  wallst:   {sky: ["#05040F", "#1A1240", "#3B1D5C"], fog: "#120C2A", fogNear: 60, fogFar: 330, ground: "#1C1F2A", sun: "#B9A8FF", sunI: .55, hemi: ["#5A4AA8", "#151020", .7],

  yacht:    {sky: ["#3E8EDC", "#8CC8F2", "#DFF3FF"], fog: "#BFE3F7", fogNear: 120, fogFar: 520, ground: "#7DBB54", sun: "#FFF4D8", sunI: 1.05, hemi: ["#BFE6FF", "#5D7F3A", .75],
             road: "#3A3C44", sea: true, pads: [.05, .62], desc: "Sun, sea and superyachts. Long straights and a twisty marina."},
  hamptons: {sky: ["#F08A4B", "#F6C27A", "#FCE6B5"], fog: "#F3C99A", fogNear: 90, fogFar: 420, ground: "#5E9A3C", sun: "#FFD49A", sunI: 1.0, hemi: ["#FFE2B8", "#3F6A2A", .7],

  var N = T.N = T.pts.length; T.seg = T.L / N;

    var a = T.pts[(i - 1 + N) % N], b = T.pts[(i + 1) % N], dx = b.x - a.x, dz = b.z - a.z, l = Math.hypot(dx, dz) || 1;

    [-4.5, -1.5, 1.5, 4.5].forEach(function(lat, j){ var a = T.at(f * T.L); T.boxes.push({x: a.x + a.nx * lat, z: a.z + a.nz * lat, h: a.h, hide: 0, id: T.boxes.length}); });

// ── karts ─────────────────────────────────────────────────────────────────────
function newKart(o){
  return {look: o.look || null, P: kartParams(o.look), id: o.id, name: o.name, color: o.color, bot: !!o.bot, skill: o.skill || .92, local: !!o.local,

          drift: 0, driftT: 0, boostT: 0, spinT: 0, shieldT: 0, item: null, rollT: 0, useT: 0, lane: (Math.random() - .5) * 6, laneT: 0,

}
function kartFlags(k){ return (k.drift ? 1 : 0) | (k.boostT > 0 ? 2 : 0) | (k.shieldT > 0 ? 4 : 0) | (k.spinT > 0 ? 8 : 0) | (k.driftT > 1.8 ? 32 : k.driftT > .9 ? 16 : 0); }

// One physics step for a kart we control (ours, or a bot we drive). `inp`: thr -1..1, steer -1..1, drift bool.
function stepKart(k, inp, dt, T, others, fx){

// ── bots ──────────────────────────────────────────────────────────────────────
function botInput(k, T, karts, race){

}
// what a bot does with its item
function botItemWant(k, karts, T){
  if (!k.item || k.rollT > 0) return false;
  k.useT += 1 / 60;
  var s = k.sT, ahead = null, behind = null;
  karts.forEach(function(o){ if (o === k) return; var d = o.sT - s; if (d > 0 && d < 70 && (!ahead || d < ahead)) ahead = d; if (d < 0 && d > -18 && (!behind || d > behind)) behind = d; });
  if (k.item === "nitro") return T.curvAt(s + 15) < .22 || k.useT > 6;
  if (k.item === "banana") return behind != null || k.useT > 9;
  if (k.item === "shot") return ahead != null || k.useT > 7;
  if (k.item === "shield") return k.useT > 1.5;
  return false;
}
function rollItem(place, n){
  var f = n > 1 ? (place - 1) / (n - 1) : 0, w;
  if (f < .2) w = {banana: 45, shield: 28, nitro: 20, shot: 7};
  else if (f < .65) w = {nitro: 34, shot: 30, banana: 20, shield: 16};
  else w = {nitro: 46, shot: 40, shield: 10, banana: 4};
  var tot = 0, k; for (k in w) tot += w[k];
  var r = Math.random() * tot; for (k in w){ r -= w[k]; if (r <= 0) return k; }
  return "nitro";

// ── 3D: renderer, track, scenery, karts ───────────────────────────────────────
var LOW = /[?&]low=1/.test(location.search) || (window.matchMedia && matchMedia("(pointer: coarse)").matches) || Math.min(screen.width, screen.height) < 500;
var R = {renderer: null, scene: null, camera: null, sun: null, world: null, karts: {}, boxes: [], hazards: {}, shots: {}, puffs: [], t: 0};
function initRenderer(){

  r.outputEncoding = THREE.sRGBEncoding;

}
function cnv(w, h, draw){ var c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h); return c; }

}
var TEX = {};
function textures(theme){
  TEX.road = tex(cnv(256, 512, function(g, w, h){
    noise(g, w, h, theme.road, .16, 9000);
    g.fillStyle = "rgba(255,255,255,.92)"; g.fillRect(6, 0, 7, h); g.fillRect(w - 13, 0, 7, h);
    g.fillStyle = "rgba(255,255,255,.55)"; for (var y = 0; y < h; y += 128) g.fillRect(w / 2 - 3, y + 20, 6, 70);

function netTick(){
  if (G.netBusy) return;

  if (G.driver === G.race.myId) body.bots = G.karts.filter(function(k){ return k.bot; }).map(function(k){ return kartState(k).concat([k.fin]); });
  api("tick", body).then(function(r){
    G.netBusy = false;
    var rtt = (performance.now() - t0) / 1000;
    if (!r || !r.ok){ if (r && r.gone){ toast("You're no longer in this race."); endToMenu(); UI.home(); } return; }
    G.netFail = 0; $("hNet").hidden = true;
    G.rtt = G.rtt * .8 + rtt * .2;
    var off = r.now - (performance.now() / 1000) + rtt / 2;
    if (Math.abs(off - G.off) > .25) G.off = off; else G.off = G.off * .9 + off * .1;
    if (r.start_at && Math.abs(r.start_at - G.startAt) > .01) G.startAt = r.start_at;
    // bots: whoever the server picks drives them
    if (r.driver !== G.driver){
      G.driver = r.driver;
      var mine = r.driver === G.race.myId;
      G.karts.forEach(function(k){ if (k.bot){ k.local = mine; k.idx = null; } });
    }
    var stNow = r.now;
    for (var id in r.karts){
      var s = r.karts[id], buf = G.snaps[id] || (G.snaps[id] = []);
      if (!buf.length || buf[buf.length - 1].st[5] !== s[5] || buf[buf.length - 1].st[0] !== s[0]) buf.push({t: stNow, st: s, fin: s[7] ? 1 : 0});
      while (buf.length > 30) buf.shift();
    }
    for (var u in r.done){ var k = kartById(u); if (k && !k.isMe && r.done[u][0] != null) k.fin = r.done[u][0]; if (k && r.done[u][1]) k.dnf = r.done[u][1]; }
    (r.ev || []).forEach(function(e){
      G.seq = Math.max(G.seq, e.seq);
      if (G.mine[e.id]) return;
      if (e.type === "banana" && !G.hazards[e.id]){ var h = {id: e.id, x: +e.x, h: +e.h, z: +e.z, t: nowS()}; G.hazards[e.id] = h; addBanana(h); }
      else if (e.type === "shot" && !G.shots[e.id]){ var age = clamp(serverNow() - e.t, 0, 2); G.shots[e.id] = {id: e.id, by: e.by, target: e.target, s: +e.s + SHOT_SPEED * age, lat: +e.lat || 0, t: nowS(), life: SHOT_LIFE - age}; addShotMesh(e.id); }
      else if (e.type === "gone"){ removeHazard(e.id, false); removeShot(e.id, false); }
    });
    if (r.results && !G.results){ G.results = r.results; setTimeout(function(){ if (G.mode === "mp") UI.results({mode: "mp", res: r.results, race: G.race}); }, G.me.fin != null ? 2500 : 500); }
  }).catch(function(){

}

    var km = buildKart({look: w.look || {c: "wolf", b: "standard", w: "standard", p: "red", d: "none"}, name: w.name, color: w.color}, false, s);
    km.g.position.set(b[0], b[1], 0); km.g.rotation.y = 0;
    var tag = nameSprite((w.you ? "★ " : "") + w.name, w.color); tag.position.y = 3.1; km.g.add(tag);
    if (i === 0) km.wheels.forEach(function(x){ x.piv.rotation.y = 0; });
  });
  // confetti
  var n = LOW ? 160 : 360, geo = new THREE.PlaneGeometry(.18, .28), mat = new THREE.MeshBasicMaterial({side: THREE.DoubleSide, vertexColors: false});
  var conf = new THREE.InstancedMesh(geo, mat, n), cols = ["#FFD23F", "#FF3D9A", "#3DE0FF", "#39E58C", "#FFFFFF", "#FF8A1F"];
  CER.bits = [];
  for (var i = 0; i < n; i++){ CER.bits.push({x: (Math.random() - .5) * 16, y: 4 + Math.random() * 14, z: (Math.random() - .5) * 10, vy: 1 + Math.random() * 1.6, rx: Math.random() * 6, rz: Math.random() * 6, sp: 2 + Math.random() * 6}); conf.setColorAt(i, new THREE.Color(cols[i % cols.length])); }
  s.add(conf); CER.confetti = conf; CER.t = 0; CER.on = true;
  CER.cam = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, .1, 300);
}
function ceremonyFrame(dt){
  if (!CER.on) return false;
  CER.t += dt;
  var d = new THREE.Object3D();
  CER.bits.forEach(function(b, i){ b.y -= b.vy * dt; if (b.y < 0) b.y = 14; b.rx += b.sp * dt; b.rz += b.sp * .7 * dt; d.position.set(b.x + Math.sin(CER.t + i) * .3, b.y, b.z); d.rotation.set(b.rx, 0, b.rz); d.updateMatrix(); CER.confetti.setMatrixAt(i, d.matrix); });
  CER.confetti.instanceMatrix.needsUpdate = true;
  var a = Math.sin(CER.t * .25) * .5, wide = innerWidth > innerHeight;
  CER.cam.aspect = innerWidth / innerHeight; CER.cam.updateProjectionMatrix();
  // on wide screens the results sit on the right, so aim the camera right of the podium to put it on the left
  var off = wide && innerWidth >= 900 ? 6.5 : 0, rad = wide ? 17 : 22;
  CER.cam.position.set(Math.sin(a) * rad + off, wide ? 6 : 9, Math.cos(a) * rad);
  CER.cam.lookAt(off, wide ? 2.4 : -1.5, 0);
  R.renderer.render(CER.scene, CER.cam);
  return true;
}
function ceremonyOff(){
  CER.on = false; if (!CER.scene) return;
  freeModel(CER.scene);
  if (CER.scene.background) CER.scene.background.dispose();
  CER.scene = null;
}

// ── boot ─────────────────────────────────────────────────────────────────────
try { initRenderer(); }
catch (e){ document.body.innerHTML = '<div class="fatal"><div><h2>Your browser can\'t run 3D right now</h2><p>Degen Kart needs WebGL. Try another browser, or turn on hardware acceleration.</p><p><a href="/me" style="color:#3DE0FF">Back to your dashboard</a></p></div></div>'; return; }
requestAnimationFrame(frame);
show(topBar() + '<div class="logo"><h1>DEGEN KART</h1><p>Warming up the engines…</p></div>');
api("info", {}).then(function(d){
  if (!d || !d.ok){ show(topBar() + '<div class="logo"><h1>DEGEN KART</h1></div><p class="err" style="text-align:center">' + esc((d && d.error) || "Couldn't load the game.") + "</p>"); return; }
  UI.info = d; UI.myName = d.name; UI.botNames = d.bot_names; UI.colors = d.static.colors || UI.colors; CAT = d.static.garage; GORDER = d.static.garage_order; GARAGE = d.garage;
  Object.keys(d.static.tracks).forEach(function(id){ TRACKS[id] = new Track(id, d.static.tracks[id]); });
  var first = store("dk_track"); G.T = TRACKS[first] || TRACKS.wallst; buildWorld(G.T);
  var join = new URLSearchParams(location.search).get("join");
  if (d.active && (!join || join.toUpperCase() === d.active.id)) UI.enterLobby(d.active);
  else if (join) UI.join(join.toUpperCase());
  else UI.home();
}).catch(function(e){ if (e && e.message === "login") return; show(topBar() + '<p class="err" style="text-align:center;margin-top:30vh">Couldn\'t reach the server. Refresh to try again.</p>'); });
document.addEventListener("visibilitychange", function(){ if (document.hidden && G.mode === "solo" && G.status === "race" && !G.paused){ G.paused = true; UI.pauseMenu(); } });
window.__kart = {G: G, R: R, UI: UI, TRACKS: TRACKS, startSolo: startSolo, useItem: useItem, standings: standings, thumb: thumb, buildKart: buildKart, GR: GR, grShow: grShow, animateDriver: animateDriver, setAuto: function(v){ G.autopilot = !!v; }};
})();
