<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>The City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0D2B21; --ink:#07100C; --line:rgba(184,146,58,.34); --rule:rgba(163,184,171,.16);
  --gold:#B8923A; --gold-ink:#D9B86C; --gold-hi:#F3D27A; --text:#E6EDE7; --muted:#A3B8AB; --faint:#7B9486;
  --ok:#A6E6BF; --bad:#F0776C; --panel:rgba(8,20,16,.96); --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#05070F;color:var(--text);font:400 15px/1.5 "IBM Plex Sans",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;
  overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
a{color:var(--gold-ink);text-underline-offset:3px}
button{font:inherit}
:focus-visible{outline:2px solid var(--gold-ink);outline-offset:2px;border-radius:4px}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--page);border-bottom:1px solid var(--line);z-index:5}
.bar h1{font:600 1.05rem/1 "IBM Plex Serif",Georgia,serif;margin:0}
.bar .bal{font-size:14px;color:var(--muted)} .bar .bal b{font-family:var(--mono);color:var(--text)}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
canvas.drag{cursor:grabbing}

/* HUD */
.hud{position:absolute;left:12px;top:12px;width:min(300px,calc(100% - 24px));background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 12px 10px;box-shadow:0 12px 30px rgba(0,0,0,.45);z-index:3}
.hud h2{font:600 1rem/1.2 "IBM Plex Serif",Georgia,serif;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
.hud h2 button{all:unset;cursor:pointer;color:var(--muted);font:500 12px var(--mono)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpis small{display:block;font-size:11px;color:var(--muted)}
.kpis b{font:600 1.05rem/1.2 var(--mono)}
.kpis .ready b{color:var(--gold-hi)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 14px/1 "IBM Plex Sans",sans-serif;background:var(--gold);color:#16261F;border:0;
  border-radius:7px;padding:10px 12px;cursor:pointer;text-decoration:none}
.btn:hover{background:#C7A048}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--gold-ink);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(184,146,58,.12)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(240,119,108,.5)}
.btn.sm{padding:7px 9px;font-size:13px}
.mine{margin-top:10px;max-height:min(34vh,260px);overflow:auto;border-top:1px solid var(--rule);padding-top:6px}
.mine button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;gap:8px;width:100%;padding:6px 4px;border-radius:5px;cursor:pointer;font-size:13px}
.mine button>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mine .r{flex:none}
.mine button:hover,.mine button:focus-visible{background:rgba(184,146,58,.1)}
.mine .r{font-family:var(--mono);color:var(--gold-ink);white-space:nowrap}
.mine .r.zero{color:var(--faint)}
.row{display:flex;gap:8px;align-items:center;margin-top:8px}
.tog{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.tog input{accent-color:var(--gold)}
.hud.min .kpis,.hud.min .mine,.hud.min .row{display:none}

.zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.zoom button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--gold-ink);font:600 18px/1 var(--mono);cursor:pointer}
.tip{position:absolute;pointer-events:none;z-index:4;background:rgba(5,9,8,.92);border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%)}
.tip b{color:var(--gold-hi);font-weight:600}

/* panel */
.panel{position:absolute;z-index:6;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.55);overflow:auto;overscroll-behavior:contain}
@media (min-width:900px){.panel{top:12px;right:12px;bottom:12px;width:390px;border-radius:12px}}
@media (max-width:899px){.panel{left:0;right:0;bottom:0;max-height:64%;border-radius:14px 14px 0 0;border-bottom:0}}
.ph{position:sticky;top:0;background:var(--panel);padding:14px 16px 10px;border-bottom:1px solid var(--rule);display:flex;gap:10px;align-items:flex-start;z-index:1}
.ph .ic{font-size:28px;line-height:1}
.ph h3{font:600 1.15rem/1.2 "IBM Plex Serif",Georgia,serif;margin:0}
.ph p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.ph .x{all:unset;margin-left:auto;cursor:pointer;color:var(--muted);font:500 20px/1 var(--mono);padding:2px 6px;border-radius:5px}
.pb{padding:12px 16px 18px}
.sec{margin:14px 0 0}
.sec h4{font:600 13px/1 "IBM Plex Sans",sans-serif;color:var(--muted);margin:0 0 8px;letter-spacing:.02em}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats div{background:rgba(255,255,255,.03);border:1px solid var(--rule);border-radius:7px;padding:7px 9px}
.stats small{display:block;font-size:11px;color:var(--muted)}
.stats b{font:600 15px/1.3 var(--mono)}
.gold{color:var(--gold-hi)} .okc{color:var(--ok)} .badc{color:var(--bad)}
.meter{height:8px;border-radius:5px;background:rgba(255,255,255,.08);overflow:hidden;margin:6px 0 4px}
.meter i{display:block;height:100%;border-radius:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.06);border:1px solid var(--rule)}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.list li:last-child{border-bottom:0}
.list .sub{display:block;font-size:12px;color:var(--muted)}
.list .price{font-family:var(--mono);font-size:13px;color:var(--gold-ink);white-space:nowrap}
.field{display:flex;gap:8px;align-items:center;margin-top:6px}
.field select,.field input{flex:1;min-width:0;font:500 14px "IBM Plex Sans",sans-serif;color:var(--text);background:rgba(0,0,0,.35);border:1px solid var(--rule);border-radius:7px;padding:8px}
.field input[type=number]{font-family:var(--mono)}
.note{font-size:12px;color:var(--muted);margin:6px 0 0}
.lock{background:rgba(240,119,108,.08);border:1px solid rgba(240,119,108,.35);border-radius:8px;padding:9px 10px;font-size:13px;margin-top:10px}
.receipt{margin:12px 16px 0;border:1px solid var(--line);border-radius:10px;background:rgba(184,146,58,.07);padding:10px 12px;font-size:13.5px;position:relative}
.receipt .x{all:unset;position:absolute;top:6px;right:8px;cursor:pointer;color:var(--muted);font:500 16px var(--mono)}
.receipt .msg+.msg{border-top:1px solid var(--rule);margin-top:8px;padding-top:8px}
.receipt h5{font:600 14px/1.25 "IBM Plex Serif",Georgia,serif;margin:0 0 4px;color:var(--gold-hi)}
.receipt .em{border-left:3px solid var(--gold);padding-left:8px;margin-top:6px}
.receipt .em b.t{display:block}
.receipt code{font-family:var(--mono);font-size:12px;background:rgba(0,0,0,.3);padding:1px 4px;border-radius:3px}
.receipt.bad{border-color:rgba(240,119,108,.5);background:rgba(240,119,108,.08)}
.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-10px);opacity:0;z-index:8;pointer-events:none;background:var(--gold-ink);color:#16261F;
  font-weight:600;padding:9px 14px;border-radius:8px;box-shadow:0 8px 22px rgba(0,0,0,.45);transition:opacity .2s,transform .2s;max-width:calc(100% - 24px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#2A0D0A}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:9;background:#05070F;color:var(--muted);font:500 14px var(--mono);letter-spacing:.08em}
@media (max-width:899px){.hud{padding:10px}.kpis b{font-size:.98rem}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <div class="bar"><a href="/me">Your dashboard</a><h1>The City</h1><span class="bal">Balance <b id="bal">—</b></span></div>
  <div class="stage" id="stage">
    <canvas id="cv" aria-label="Map of the city. Use the list of your buildings to manage them with a keyboard."></canvas>
    <div class="hud" id="hud">
      <h2><span>Your empire</span><button type="button" id="hudMin" aria-expanded="true">hide</button></h2>
      <div class="kpis">
        <div><small>Earning</small><b id="kRate">—</b></div>
        <div class="ready"><small>Ready to collect</small><b id="kReady">—</b></div>
      </div>
      <button class="btn wide" id="collectAll" type="button">Collect everything</button>
      <div class="row">
        <label class="tog"><input type="checkbox" id="onlyMine"> Only mine</label>
        <span style="flex:1"></span>
        <button class="btn ghost sm" id="findMine" type="button">Find mine</button>
      </div>
      <div class="mine" id="mine" aria-label="Your buildings"></div>
    </div>
    <div class="zoom"><button type="button" id="zIn" aria-label="Zoom in">+</button><button type="button" id="zOut" aria-label="Zoom out">−</button><button type="button" id="zHome" aria-label="Show the whole city">⌂</button></div>
    <div class="tip" id="tip" hidden></div>
    <aside class="panel" id="panel" hidden aria-live="polite"></aside>
    <div class="toast" id="toast" role="status"></div>
    <div class="loading" id="loading">LOADING THE CITY…</div>
  </div>
</div>

<script>
(function(){
"use strict";
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function n(v){ return Math.round(Number(v || 0)).toLocaleString("en-US"); }
function api(path, body){
  return fetch(path, {method: body ? "POST" : "GET", credentials: "same-origin", cache: "no-store",
    headers: body ? {"Content-Type": "application/json"} : {}, body: body ? JSON.stringify(body) : undefined})
    .then(function(r){ if (r.status === 401){ location.href = "/auth/login"; throw new Error("login"); } return r.json(); });
}
var REDUCED = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function hs(s){ var h = 2166136261; s = String(s); for (var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ var a = seed >>> 0; return function(){ a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function ago(ts){ var s = Math.round(ts - Date.now() / 1000), a = Math.abs(s), u = a < 3600 ? Math.max(1, Math.round(a / 60)) + " min" : a < 86400 ? Math.round(a / 3600) + " h" : Math.round(a / 86400) + " d"; return s > 0 ? "in " + u : u + " ago"; }

// ── Static data ──────────────────────────────────────────────────────────────
var TW = 64, TH = 32, AVE = 2;
var DISTRICTS = [
  {key: "uptown", col: 0, row: 0, tint: [120, 90, 200]}, {key: "downtown", col: 1, row: 0, tint: [220, 70, 140]},
  {key: "docks", col: 2, row: 0, tint: [60, 150, 210]}, {key: "westside", col: 0, row: 1, tint: [230, 160, 60]},
  {key: "projects", col: 1, row: 1, tint: [150, 150, 160]}, {key: "trainyard", col: 2, row: 1, tint: [190, 110, 60]}
];
// Building looks: h = height (px at zoom 1), f = footprint (share of the tile), wall/roof colours, style
var LOOK = {
  "re:studio": {h: 24, f: .62, wall: "#6E4B3A", roof: "#3A2A24", st: "brick"},
  "re:condo": {h: 40, f: .7, wall: "#7C6A5A", roof: "#3D3530", st: "res"},
  "re:townhouse": {h: 30, f: .72, wall: "#8C5A44", roof: "#4A2C22", st: "brick"},
  "re:duplex": {h: 32, f: .8, wall: "#6E7A86", roof: "#38404A", st: "res"},
  "re:loft": {h: 52, f: .82, wall: "#7A3F2E", roof: "#3A231C", st: "brick", tank: 1},
  "re:beachhouse": {h: 22, f: .84, wall: "#D9CDB4", roof: "#8C7A5A", st: "villa", pool: 1},
  "re:mansion": {h: 36, f: .9, wall: "#E4DCCB", roof: "#5A4A3A", st: "villa", pool: 1},
  "re:skytower": {h: 150, f: .76, wall: "#33445C", roof: "#1F2A3A", st: "glass", heli: 1},
  "re:penthouse": {h: 196, f: .8, wall: "#2A2F45", roof: "#141826", st: "glass", crown: 1},
  "re:casino": {h: 84, f: .92, wall: "#4A1F3A", roof: "#2A1020", st: "casino"},
  "re:island": {h: 14, f: .9, wall: "#E8DDBF", roof: "#B89A5A", st: "island"},
  "biz:lemonade": {h: 9, f: .5, wall: "#F2D45C", roof: "#F2F0E6", st: "stand"},
  "biz:foodtruck": {h: 13, f: .52, wall: "#E9ECEF", roof: "#C9CED6", st: "truck"},
  "biz:barbershop": {h: 26, f: .66, wall: "#8A8F99", roof: "#3F434B", st: "shop", awn: "#C8322B", pole: 1},
  "biz:cafe": {h: 28, f: .7, wall: "#7B5A44", roof: "#3D2C22", st: "shop", awn: "#1F6B4A"},
  "biz:gym": {h: 40, f: .84, wall: "#4B5563", roof: "#2B3039", st: "shop", awn: "#E1572A"},
  "biz:nightclub": {h: 46, f: .82, wall: "#2B2140", roof: "#151022", st: "club", neon: "#FF4FA3"},
  "biz:casino": {h: 66, f: .9, wall: "#4A1F3A", roof: "#2A1020", st: "casino"},
  "biz:techstartup": {h: 118, f: .74, wall: "#1F4E5A", roof: "#123038", st: "glass", logo: 1},
  "venue:dive_bar": {h: 24, f: .66, wall: "#5A4636", roof: "#2E241C", st: "club", neon: "#FFB347"},
  "venue:sports_bar": {h: 30, f: .74, wall: "#3E4A5C", roof: "#232A36", st: "club", neon: "#4FE3FF"},
  "venue:cocktail_lounge": {h: 42, f: .74, wall: "#2E2246", roof: "#171026", st: "club", neon: "#B48CFF"},
  "venue:speakeasy": {h: 26, f: .7, wall: "#6A3B2C", roof: "#2E1A14", st: "brick", neon: "#FFB347"},
  "venue:nightclub": {h: 54, f: .84, wall: "#24183A", roof: "#120C1E", st: "club", neon: "#FF4FA3"},
  "venue:rooftop": {h: 108, f: .74, wall: "#283048", roof: "#151A28", st: "glass", neon: "#4FE3FF", rooftop: 1},
  "venue:mega_club": {h: 70, f: .92, wall: "#1C1430", roof: "#0E0A18", st: "club", neon: "#B48CFF", mega: 1}
};
var ICON = {}; // filled from the catalog

// ── State ────────────────────────────────────────────────────────────────────
var S = null, fetchedAt = 0, world = null, sel = null, hover = null, onlyMine = false;
var cam = {x: 0, y: 0, z: 1};
var cv = $("cv"), ctx = cv.getContext("2d"), W = 0, H = 0, DPR = 1;

// ── Layout: districts → blocks → lots ────────────────────────────────────────
function layout(st){
  var by = {};
  DISTRICTS.forEach(function(d){ by[d.key] = []; });
  st.city.forEach(function(b){ (by[b.d] || by.downtown).push(b); });
  var info = DISTRICTS.map(function(d){
    var list = by[d.key].slice().sort(function(a, b){ return (hs(a.id) - hs(b.id)) || (a.id < b.id ? -1 : 1); });
    var sale = Math.max(4, Math.ceil(list.length * 0.15)), total = list.length + sale;
    var blocks = Math.max(4, Math.ceil(total / 6)), bx = Math.max(2, Math.ceil(Math.sqrt(blocks))), byy = Math.max(2, Math.ceil(blocks / bx));
    return {d: d, list: list, sale: sale, bx: bx, by: byy, W: bx * 3 + 1, H: byy * 4 + 1};
  });
  var colW = [0, 0, 0], rowH = [0, 0];
  info.forEach(function(x){ colW[x.d.col] = Math.max(colW[x.d.col], x.W); rowH[x.d.row] = Math.max(rowH[x.d.row], x.H); });
  var colX = [AVE, 0, 0], rowY = [AVE, 0];
  colX[1] = colX[0] + colW[0] + AVE; colX[2] = colX[1] + colW[1] + AVE; rowY[1] = rowY[0] + rowH[0] + AVE;
  var GX = colX[2] + colW[2] + AVE, GY = rowY[1] + rowH[1] + AVE;
  var items = [], lots = [], districts = [];
  info.forEach(function(x){
    var ox = colX[x.d.col] + Math.floor((colW[x.d.col] - x.W) / 2), oy = rowY[x.d.row] + Math.floor((rowH[x.d.row] - x.H) / 2);
    var cells = [];
    for (var j = 0; j < x.by; j++) for (var i = 0; i < x.bx; i++) for (var ly = 0; ly < 3; ly++) for (var lx = 0; lx < 2; lx++)
      cells.push({tx: ox + 1 + i * 3 + lx, ty: oy + 1 + j * 4 + ly});
    var r = rng(hs(x.d.key));
    for (var k = cells.length - 1; k > 0; k--){ var q = Math.floor(r() * (k + 1)), t = cells[k]; cells[k] = cells[q]; cells[q] = t; }
    var dist = {key: x.d.key, ox: ox, oy: oy, W: x.W, H: x.H, tint: x.d.tint, bx: x.bx, by: x.by};
    districts.push(dist);
    cells.forEach(function(c, idx){
      var lot = {tx: c.tx, ty: c.ty, d: x.d.key};
      if (idx < x.list.length){ lot.b = x.list[idx]; lot.b.tx = c.tx; lot.b.ty = c.ty; lot.kind = "b"; }
      else if (idx < x.list.length + x.sale) lot.kind = "sale";
      else lot.kind = r() < 0.45 ? "park" : r() < 0.6 ? "lot" : "city";
      lot.seed = hs(x.d.key + ":" + c.tx + ":" + c.ty);
      lots.push(lot);
    });
  });
  lots.sort(function(a, b){ return (a.tx + a.ty) - (b.tx + b.ty) || a.tx - b.tx; });
  // avenue centre lines for traffic
  var lanes = [];
  [colX[1] - 1, colX[2] - 1].forEach(function(x){ lanes.push({axis: "y", c: x, a: 0.5, b: GY - 0.5}); });
  [rowY[1] - 1].forEach(function(y){ lanes.push({axis: "x", c: y, a: 0.5, b: GX - 0.5}); });
  lanes.push({axis: "x", c: AVE - 1, a: 0.5, b: GX - 0.5}); lanes.push({axis: "y", c: AVE - 1, a: 0.5, b: GY - 0.5});
  return {lots: lots, districts: districts, GX: GX, GY: GY, colX: colX, rowY: rowY, colW: colW, rowH: rowH, lanes: lanes};
}

// ── Projection ───────────────────────────────────────────────────────────────
function wx(tx, ty){ return (tx - ty) * TW / 2; }
function wy(tx, ty){ return (tx + ty) * TH / 2; }
function sx(x){ return (x - cam.x) * cam.z + W / 2; }
function sy(y){ return (y - cam.y) * cam.z + H / 2; }
function toTile(px, py){ var x = (px - W / 2) / cam.z + cam.x, y = (py - H / 2) / cam.z + cam.y;
  return {tx: (y / (TH / 2) + x / (TW / 2)) / 2, ty: (y / (TH / 2) - x / (TW / 2)) / 2}; }
function poly(pts, fill){ ctx.beginPath(); ctx.moveTo(sx(pts[0][0]), sy(pts[0][1])); for (var i = 1; i < pts.length; i++) ctx.lineTo(sx(pts[i][0]), sy(pts[i][1])); ctx.closePath(); if (fill){ ctx.fillStyle = fill; ctx.fill(); } }
function rectT(x0, y0, x1, y1){ return [[wx(x0, y0), wy(x0, y0)], [wx(x1, y0), wy(x1, y0)], [wx(x1, y1), wy(x1, y1)], [wx(x0, y1), wy(x0, y1)]]; }

// ── Sprites (each building drawn once, then blitted) ─────────────────────────
var SPR = {}, SPR_LAST = {}, SC = 1, lastZoomAt = 0;   // sprites at the current zoom; SPR_LAST stands in mid-zoom
function shade(hex, k){ var c = parseInt(hex.slice(1), 16), r = c >> 16, g = (c >> 8) & 255, b = c & 255;
