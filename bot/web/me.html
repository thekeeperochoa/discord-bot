<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your JB dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Homemade+Apple&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --page:#0D2B21; --page-2:#143A2D; --line:rgba(184,146,58,.34);
  --gold:#B8923A; --gold-ink:#D9B86C;
  --text:#E6EDE7; --muted:#A3B8AB; --faint:#7B9486;
  --paper:#E8EFE4; --paper-ink:#16261F; --paper-muted:#56695D; --paper-line:#9DB2A4;
  --pen:#1D3F8F; --stamp:#B3261E;
  --loss:#EE8A80; --ready:#A6E6BF;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--text);
  font:400 15px/1.55 "IBM Plex Sans",system-ui,-apple-system,sans-serif;
  font-variant-numeric:tabular-nums}
a{color:var(--gold-ink);text-underline-offset:3px}
a:focus-visible,button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-ink);outline-offset:3px;border-radius:2px}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 56px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who img{width:30px;height:30px;border-radius:50%;flex:none;background:var(--page-2)}
.who span{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who strong{color:var(--text);font-weight:500}
.links{display:flex;gap:18px;font-size:14px}

/* the check */
.check{position:relative;color:var(--paper-ink);background-color:var(--paper);border-radius:5px;
  padding:20px 22px 18px;box-shadow:0 1px 0 rgba(0,0,0,.25),0 14px 34px rgba(0,0,0,.38);
  background-image:
    repeating-linear-gradient(135deg,rgba(22,38,31,.04) 0 1px,transparent 1px 5px),
    repeating-linear-gradient(45deg,rgba(22,38,31,.03) 0 1px,transparent 1px 9px),
    radial-gradient(120% 90% at 85% 10%,rgba(184,146,58,.14),transparent 60%);
  overflow:hidden}
.check::before{content:"";position:absolute;inset:7px;border:1px solid rgba(22,38,31,.18);border-radius:3px;pointer-events:none}
.ck-row{position:relative;display:flex;align-items:flex-end;gap:14px}
.ck-head{justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.bank{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.06rem;letter-spacing:.01em}
.bank small{display:block;font-weight:400;font-size:.78rem;color:var(--paper-muted);letter-spacing:0}
.ck-no{font-family:"IBM Plex Serif",Georgia,serif;font-size:.9rem;color:var(--paper-muted)}
.lbl{font-size:.72rem;line-height:1.2;color:var(--paper-muted);flex:none}
.hand{font-family:"Homemade Apple","Segoe Script","Brush Script MT",cursive;color:var(--pen);
  font-size:clamp(1rem,3.3vw,1.45rem);line-height:1.5;min-height:1.5em}
.fill{flex:1;min-width:0;border-bottom:1px solid var(--paper-line);padding:0 6px 2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck-date{justify-content:flex-end;margin-bottom:10px}
.ck-date .fill{flex:0 1 190px;font-size:clamp(.85rem,2.6vw,1.05rem)}
.ck-pay{flex-wrap:wrap;margin-bottom:10px}
.ck-pay .fill{flex:1 1 220px}
.amt{flex:none;margin-left:auto;display:flex;align-items:center;gap:6px;border:1.5px solid rgba(22,38,31,.55);
  border-radius:3px;padding:3px 10px;background:rgba(255,255,255,.35);
  font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:clamp(1rem,3.4vw,1.35rem)}
.ck-words{margin-bottom:16px}
.ck-words .fill{white-space:normal;font-size:clamp(.82rem,2.5vw,1.08rem);line-height:2em;
  background-image:linear-gradient(transparent calc(100% - 1px),var(--paper-line) 0);
  background-size:100% 2em;border-bottom:0;text-overflow:clip}
.ck-foot{justify-content:space-between;flex-wrap:wrap;gap:16px 28px}
.memo{flex:1 1 220px;display:flex;align-items:flex-end;gap:10px;min-width:0}
.memo .fill{font-size:clamp(.82rem,2.4vw,1rem)}
.sig{flex:0 0 auto;text-align:center;min-width:170px;margin-left:auto}
.sig .hand{display:block;border-bottom:1px solid var(--paper-line);padding:0 8px 2px;font-size:clamp(1.05rem,3.4vw,1.4rem)}
.sig .lbl{display:block;margin-top:4px}
.stamp{position:absolute;left:50%;bottom:54px;transform:translateX(-50%) rotate(-9deg);white-space:nowrap;border:3px solid var(--stamp);
  color:var(--stamp);font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.05rem;
  padding:4px 12px;border-radius:4px;opacity:.82;mix-blend-mode:multiply;pointer-events:none}
.stamp[hidden]{display:none}

/* the one orchestrated moment: the check gets written in, once */
.writable{clip-path:inset(0 100% 0 0)}
.written .writable{animation:ink .7s cubic-bezier(.3,.6,.3,1) forwards}
.written .w2{animation-delay:.35s}.written .w3{animation-delay:.7s}
.written .w4{animation-delay:1.05s}.written .w5{animation-delay:1.4s}
@keyframes ink{to{clip-path:inset(0 0 0 0)}}
@media (prefers-reduced-motion:reduce){.writable{clip-path:none}.written .writable{animation:none}}

.note{color:var(--muted);font-size:14px;margin:12px 2px 0}
.note[hidden]{display:none}

/* standing band */
.standing{display:grid;grid-template-columns:1fr;gap:18px 40px;margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}
@media (min-width:700px){.standing{grid-template-columns:1fr 1fr}}
.big{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.35rem;line-height:1.25;margin:0 0 8px}
.pips{display:flex;gap:6px;margin:4px 0 8px}
.pip{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--gold)}
.pip.on{background:var(--gold)}
.meter{height:8px;border-radius:4px;background:var(--page-2);overflow:hidden;margin:6px 0 6px}
.meter i{display:block;height:100%;border-radius:4px;background:var(--gold)}
.sub{color:var(--muted);font-size:14px;margin:0}
.badges{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;color:var(--muted);font-size:14px}

/* columns */
.cols{display:grid;grid-template-columns:1fr;gap:0 44px}
@media (min-width:860px){.cols{grid-template-columns:1.12fr 1fr}}
section.sec{margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
h2{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1.18rem;line-height:1.3;margin:0 0 12px}
h3{font-family:"IBM Plex Serif",Georgia,serif;font-weight:600;font-size:1rem;margin:18px 0 6px}
h3 .count{font-family:"IBM Plex Sans",sans-serif;font-weight:400;color:var(--faint);font-size:.9rem}
.empty{color:var(--muted);margin:0}
ul.rows{list-style:none;margin:0;padding:0}
ul.rows li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-bottom:1px solid rgba(163,184,171,.12)}
ul.rows li:last-child{border-bottom:0}
.r-main{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-side{flex:none;color:var(--muted);text-align:right}
.r-dim{color:var(--faint)}
.loss{color:var(--loss)}
.ok{color:var(--ready)}
.gold{color:var(--gold-ink)}

/* net worth bar */
.bar{position:relative;display:flex;gap:2px;height:16px;margin:4px 0 14px}
.seg{height:100%;border-radius:3px;min-width:4px;cursor:default}
.legend{list-style:none;margin:0;padding:0}
.legend li{display:grid;grid-template-columns:12px 1fr auto 3.6em;align-items:baseline;gap:10px;padding:5px 0}
.sw{width:12px;height:12px;border-radius:3px;align-self:center}
.legend .v{text-align:right}
.legend .p{text-align:right;color:var(--faint)}
.legend .total{border-top:1px solid rgba(163,184,171,.2);margin-top:4px;padding-top:9px;font-weight:600}
.tip{position:absolute;z-index:5;pointer-events:none;background:#0A1F18;color:var(--text);border:1px solid var(--line);
  padding:6px 9px;border-radius:4px;font-size:13px;white-space:nowrap;transform:translate(-50%,-100%);margin-top:-8px}
.tip[hidden]{display:none}

/* record */
.figs{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin:0}
.figs div{margin:0}
.figs dt{color:var(--muted);font-size:13px}
.figs dd{margin:2px 0 0;font-family:"IBM Plex Serif",Georgia,serif;font-size:1.15rem}

/* fmk + achievements */
.fmk li .r-main{white-space:normal}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.chips li{background:var(--page-2);border-radius:4px;padding:4px 9px;font-size:14px}
.up li .r-main{white-space:normal}
.games li .r-main{white-space:normal}
.games .r-dim{display:block;font-size:13px}

/* memory */
blockquote{margin:0;padding:2px 0 2px 16px;border-left:2px solid var(--gold);
  font-family:"IBM Plex Serif",Georgia,serif;font-style:italic;font-size:1.02rem;line-height:1.65;color:var(--text);max-width:62ch}
code{font-family:inherit;color:var(--gold-ink);background:rgba(184,146,58,.12);padding:1px 5px;border-radius:3px}
.foot{margin-top:40px;color:var(--faint);font-size:13px}
.err{margin-top:24px}
.err button{margin-top:12px;font:inherit;background:var(--gold);color:#16261F;border:0;border-radius:4px;padding:9px 16px;font-weight:600;cursor:pointer}

/* ═════════════════ THE ARCADE ═════════════════ */
.arcade{position:relative;margin:30px -6px 6px;padding:22px 18px 24px;border-radius:22px;isolation:isolate;overflow:hidden;overflow:clip;
  background:
    radial-gradient(120% 70% at 50% -10%,rgba(217,184,108,.20),transparent 60%),
    radial-gradient(60% 50% at 0% 100%,rgba(57,135,229,.16),transparent 70%),
    radial-gradient(60% 50% at 100% 100%,rgba(213,81,129,.16),transparent 70%),
    linear-gradient(180deg,#0A2219 0%,#07170F 100%);
  box-shadow:0 0 0 1px rgba(217,184,108,.35),0 0 0 6px rgba(7,23,15,.9),0 0 0 7px rgba(217,184,108,.18),0 30px 70px rgba(0,0,0,.5)}
.arcade::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.5;
  background:repeating-linear-gradient(90deg,rgba(217,184,108,.05) 0 1px,transparent 1px 44px),repeating-linear-gradient(0deg,rgba(217,184,108,.04) 0 1px,transparent 1px 44px);
  mask-image:radial-gradient(90% 80% at 50% 0%,#000,transparent 80%);-webkit-mask-image:radial-gradient(90% 80% at 50% 0%,#000,transparent 80%)}
.ar-beams{position:absolute;inset:-20% -10% auto;height:120%;z-index:-1;pointer-events:none;opacity:.9;
  background:conic-gradient(from 200deg at 15% -10%,transparent 0 6deg,rgba(255,236,190,.16) 8deg 14deg,transparent 16deg 360deg),
             conic-gradient(from 140deg at 85% -10%,transparent 0 6deg,rgba(255,236,190,.16) 8deg 14deg,transparent 16deg 360deg);
  animation:ar-sweep 9s ease-in-out infinite alternate}
@keyframes ar-sweep{0%{transform:rotate(-3deg)}100%{transform:rotate(3deg)}}
.ar-sparks{position:absolute;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.ar-sparks i{position:absolute;bottom:-10px;width:3px;height:3px;border-radius:50%;background:#F4D58D;box-shadow:0 0 8px 2px rgba(244,213,141,.7);opacity:0;animation:ar-rise linear infinite}
@keyframes ar-rise{0%{transform:translateY(0) scale(.6);opacity:0}12%{opacity:.9}100%{transform:translateY(-560px) scale(1.1);opacity:0}}

/* marquee sign */
.ar-head{display:flex;align-items:center;justify-content:space-between;gap:14px 20px;flex-wrap:wrap;margin-bottom:18px}
.ar-sign{position:relative;padding:22px 34px 20px;border-radius:18px;background:linear-gradient(180deg,#3A2708,#170E02);
  box-shadow:inset 0 0 0 3px #B8923A,inset 0 0 0 5px #3A2708,inset 0 0 0 6px rgba(217,184,108,.5),inset 0 0 40px rgba(255,200,90,.22),0 0 0 1px rgba(0,0,0,.6),0 12px 34px rgba(0,0,0,.5)}
.ar-sign::before{content:"";position:absolute;inset:-46px -60px;z-index:-1;pointer-events:none;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,196,84,.42),rgba(255,170,60,.16) 55%,transparent);animation:ar-halo 2.4s ease-in-out infinite}
@keyframes ar-halo{0%,100%{opacity:.75;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
.ar-bulbs{position:absolute;inset:0;pointer-events:none}
.ar-bulbs i{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff 0 18%,#FFE9A8 40%,#FFC24A 100%);
  box-shadow:0 0 3px 1px #FFE29A,0 0 10px 3px rgba(255,190,70,.85),0 0 22px 6px rgba(255,170,50,.35);
  animation:ar-bulb 1.05s linear infinite}
@keyframes ar-bulb{0%,30%{background:radial-gradient(circle at 35% 35%,#fff 0 18%,#FFE9A8 40%,#FFC24A 100%);box-shadow:0 0 3px 1px #FFE29A,0 0 10px 3px rgba(255,190,70,.85),0 0 22px 6px rgba(255,170,50,.35)}
  34%,96%{background:radial-gradient(circle at 35% 35%,#B48A3E,#6B4A14);box-shadow:0 0 2px rgba(255,190,70,.25)}}
.ar-title{margin:0;font:400 clamp(1.7rem,6vw,2.6rem)/1 "Bungee","Impact",system-ui,sans-serif;letter-spacing:.04em;
  background:linear-gradient(180deg,#FFF3C4 0%,#F4D58D 40%,#B8923A 75%,#FFE7A3 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 #5A3F0A) drop-shadow(0 0 14px rgba(244,213,141,.45));animation:ar-flicker 6s infinite}
@keyframes ar-flicker{0%,93%,100%{opacity:1}94%{opacity:.55}95%{opacity:1}96.5%{opacity:.7}97%{opacity:1}}
.ar-meta{display:flex;flex-direction:column;gap:6px;align-items:flex-end;text-align:right}
.ar-meta .big{font:400 1.05rem/1.2 "IBM Plex Serif",Georgia,serif;color:var(--text);margin:0}
.ar-meta .big b{color:var(--gold-ink);font-weight:600}
.ar-meta .sub{font-size:13px}
.ar-ring{display:flex;align-items:center;gap:10px}
.ar-ring svg{width:46px;height:46px;transform:rotate(-90deg)}
.ar-ring circle{fill:none;stroke-width:5}
.ar-ring .bgc{stroke:rgba(217,184,108,.16)} .ar-ring .fgc{stroke:url(#ar-goldgrad);stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1)}
@media (max-width:620px){.ar-meta{align-items:flex-start;text-align:left}.arcade{margin-left:-10px;margin-right:-10px;padding:18px 12px 20px;border-radius:18px}}

/* spotlight */
.ar-spot{position:relative;border-radius:18px;overflow:hidden;min-height:250px;margin-bottom:18px;background:#05110B;
  box-shadow:0 0 0 1px rgba(255,255,255,.08),0 18px 40px rgba(0,0,0,.45)}
.ar-slide{position:absolute;inset:0;display:grid;grid-template-columns:1.05fr 1fr;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility 0s .7s}
.ar-slide.on{opacity:1;visibility:visible;transition:opacity .7s ease}
.ar-slide .ar-art{position:relative;height:100%;min-height:250px;order:2}
.ar-slide .ar-art > svg{transform:scale(1.08);transition:transform 7s ease-out}
.ar-slide.on .ar-art > svg{transform:scale(1)}
.ar-slide .ar-art::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#05110B 0%,rgba(5,17,11,.6) 22%,transparent 55%)}
.ar-copy{position:relative;z-index:1;padding:26px 8px 26px 26px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.ar-copy > *{opacity:0;transform:translateY(14px)}
.ar-slide.on .ar-copy > *{animation:ar-up .65s cubic-bezier(.2,.8,.2,1) forwards}
.ar-slide.on .ar-copy > *:nth-child(2){animation-delay:.08s}.ar-slide.on .ar-copy > *:nth-child(3){animation-delay:.16s}
.ar-slide.on .ar-copy > *:nth-child(4){animation-delay:.24s}.ar-slide.on .ar-copy > *:nth-child(5){animation-delay:.32s}
@keyframes ar-up{to{opacity:1;transform:none}}
.ar-slide.on .ar-copy > .ar-kicker{animation:ar-up .65s cubic-bezier(.2,.8,.2,1) forwards,ar-shine 3s linear infinite}
.ar-kicker{align-self:flex-start;font:600 11px/1 "IBM Plex Sans";letter-spacing:.14em;text-transform:uppercase;color:#130C02;padding:6px 9px;border-radius:999px;
  background:linear-gradient(90deg,#F4D58D,#FFF0C2,#D9B86C);background-size:200% 100%;animation:ar-shine 3s linear infinite}
@keyframes ar-shine{to{background-position:-200% 0}}
.ar-spot h3{margin:0;font:400 clamp(1.6rem,5vw,2.3rem)/1.02 "Bungee","Impact",sans-serif;letter-spacing:.02em;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.4),0 0 24px var(--acc)}
.ar-spot p{margin:0;color:#D5E2DA;max-width:38ch}
.ar-cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.ar-btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;text-decoration:none;font:600 15px/1 "IBM Plex Sans";
  padding:12px 18px;border-radius:12px;color:#130C02;background:linear-gradient(180deg,#FFE7A3,#D9B86C);box-shadow:0 4px 0 #8A6A22,0 10px 24px rgba(217,184,108,.25);
  transition:transform .15s,box-shadow .15s}
.ar-btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 #8A6A22,0 14px 30px rgba(217,184,108,.35)}
.ar-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #8A6A22}
.ar-btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:ar-glint 3.2s ease-in-out infinite}
@keyframes ar-glint{0%,60%{left:-60%}85%,100%{left:130%}}
.ar-btn.ghost{background:rgba(255,255,255,.06);color:var(--text);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.ar-btn.ghost::after{display:none}
.ar-dots{position:absolute;left:26px;bottom:14px;z-index:2;display:flex;gap:8px}
.ar-dot{width:30px;height:4px;border-radius:2px;border:0;padding:0;background:rgba(255,255,255,.2);cursor:pointer;overflow:hidden;position:relative}
.ar-dot i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);background:var(--gold-ink)}
.ar-dot.on i{animation:ar-fill var(--spot-ms,6500ms) linear forwards}
.ar-spot.paused .ar-dot.on i{animation-play-state:paused}
@keyframes ar-fill{to{transform:scaleX(1)}}
@media (max-width:700px){
  .ar-spot{min-height:400px}
  .ar-slide{grid-template-columns:1fr;grid-template-rows:170px 1fr}
  .ar-slide .ar-art{order:0;min-height:170px}
  .ar-slide .ar-art::after{background:linear-gradient(0deg,#05110B 0%,transparent 60%)}
  .ar-copy{padding:6px 18px 40px}
  .ar-dots{left:18px}
}

/* filters */
.ar-filters{position:relative;display:flex;gap:3px;overflow-x:auto;scrollbar-width:none;padding:4px;margin:0 0 16px;border-radius:14px;
  background:rgba(0,0,0,.28);box-shadow:inset 0 0 0 1px rgba(217,184,108,.16)}
.ar-filters::-webkit-scrollbar{display:none}
@media (min-width:701px){.ar-filters{flex-wrap:wrap;overflow:visible}}
.ar-pill{position:absolute;top:0;left:0;height:38px;border-radius:10px;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(244,213,141,.95),rgba(184,146,58,.95));box-shadow:0 6px 18px rgba(217,184,108,.35);
  transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .45s cubic-bezier(.3,1.3,.5,1)}
.ar-chip{position:relative;z-index:1;flex:none;display:inline-flex;align-items:center;gap:7px;border:0;background:none;color:var(--muted);cursor:pointer;
  font:500 14px/1 "IBM Plex Sans";padding:10px 9px;border-radius:10px;transition:color .3s}
.ar-chip:hover{color:var(--text)}
.ar-chip[aria-pressed="true"]{color:#130C02;font-weight:600}
.ar-chip .ct{font:600 11px/1 "IBM Plex Sans";padding:3px 6px;border-radius:999px;background:rgba(255,255,255,.08)}
.ar-chip[aria-pressed="true"] .ct{background:rgba(19,12,2,.18)}

/* cards */
.ar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.ar-card{--acc:#D9B86C;--acc2:#3987e5;position:relative;display:flex;flex-direction:column;text-decoration:none;color:var(--text);border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));box-shadow:0 0 0 1px rgba(255,255,255,.08),0 12px 28px rgba(0,0,0,.4);
  transform-style:preserve-3d;will-change:transform;transition:transform .5s cubic-bezier(.2,.8,.2,1),box-shadow .4s,opacity .3s;
  opacity:0;transform:translateY(26px) scale(.97)}
.ar-card.in{opacity:1;transform:none;transition-delay:calc(var(--i,0) * 55ms)}

.ar-art > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ar-card .ar-art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(5,17,11,.85))}

  background:radial-gradient(380px circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.55),transparent 45%)}
.ar-card:hover .ar-glare{opacity:1}
.ar-badge{position:absolute;top:10px;left:10px;z-index:2;font:700 10px/1 "IBM Plex Sans";letter-spacing:.12em;padding:5px 8px;border-radius:999px;color:#130C02;
  background:linear-gradient(90deg,#FFE7A3,#D9B86C);box-shadow:0 0 0 0 rgba(255,231,163,.7);animation:ar-ping 2.2s infinite}
.ar-badge.upd{background:linear-gradient(90deg,#A6E6BF,#5FC48A)}
@keyframes ar-ping{0%{box-shadow:0 0 0 0 rgba(255,231,163,.55)}70%,100%{box-shadow:0 0 0 10px rgba(255,231,163,0)}}
.ar-emoji{position:absolute;right:12px;top:127px;z-index:2;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(180deg,#123526,#0A2219);box-shadow:0 0 0 1px rgba(255,255,255,.1),0 8px 18px rgba(0,0,0,.5),0 0 18px color-mix(in srgb,var(--acc) 45%,transparent);
  transform:translateZ(50px);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}

.ar-body{position:relative;padding:14px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1;transform:translateZ(20px)}
.ar-name{margin:0;font:400 1.15rem/1.1 "Bungee","Impact",sans-serif;letter-spacing:.02em;color:#fff}

  box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
.ar-tag.hot{color:var(--acc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.ar-blurb{margin:0;font-size:13.5px;color:#C9D6CE;line-height:1.45;padding-right:30px}
.ar-stat{margin:0;font-size:12.5px;color:var(--muted);line-height:1.45;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.22);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.ar-stat b{color:var(--text);font-weight:600}
.ar-meter{height:5px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
.ar-meter i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width 1.4s cubic-bezier(.2,.8,.2,1) .3s}
.ar-meter-l{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:-3px}
.ar-play{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);font-size:13px;color:var(--faint)}
.ar-play > span:first-child{font-size:12px}
.ar-play > span:last-child{flex:none;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;font:600 13px/1 "IBM Plex Sans";color:#130C02;background:linear-gradient(180deg,#FFE7A3,#D9B86C);
  padding:8px 12px;border-radius:9px;box-shadow:0 3px 0 #8A6A22;transition:transform .2s,gap .2s}
.ar-card:hover .ar-play > span:last-child{transform:translateY(-1px);gap:10px}
.ar-hidden{display:none!important}
@media (max-width:620px){.ar-card .ar-art{height:124px}.ar-emoji{top:101px}
  .ar-blurb{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}}

/* the little scenes */
.ar-anim *{transform-box:fill-box;transform-origin:center}

@keyframes a-dash{to{stroke-dashoffset:-44}}

@keyframes a-pop{0%,8%{transform:scale(0);opacity:0}16%{transform:scale(1.15);opacity:1}22%,70%{transform:scale(1);opacity:1}82%,100%{transform:scale(1);opacity:0}}
@keyframes a-reel{to{transform:translateY(-150px)}}
@keyframes a-reveal{0%,10%{opacity:0;transform:scale(.4)}18%,80%{opacity:1;transform:scale(1)}90%,100%{opacity:0;transform:scale(.8)}}
@keyframes a-boom{0%,100%{opacity:.35;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
@keyframes a-fan{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-5px) rotate(var(--r))}}
@keyframes a-sweep{0%,55%{transform:translateX(-120px)}100%{transform:translateX(420px)}}
@keyframes a-sway{0%,100%{transform:skewX(-6deg)}50%{transform:skewX(6deg)}}
@keyframes a-hop{0%,60%,100%{transform:translateY(0)}70%{transform:translateY(-10px)}80%{transform:translateY(0)}86%{transform:translateY(-4px)}}
@keyframes a-ball{0%{transform:translate(0,0);opacity:0}5%{opacity:1}45%{transform:translate(var(--bx),var(--by));opacity:1}50%,100%{transform:translate(var(--bx),var(--by));opacity:0}}

  .ar-anim *, .ar-anim, .ar-beams, .ar-sparks i, .ar-sign::before, .ar-bulbs i, .ar-title, .ar-btn::after, .ar-kicker, .ar-badge{animation:none!important}

<body>
<div class="wrap">
  <header class="top">
    <div class="who"><img id="av" alt="" hidden><span id="who">Signed in</span></div>
    <nav class="links"><a href="/city">🌃 The City</a><a id="adminLink" href="/" hidden>Admin dashboard</a><a href="/auth/logout">Log out</a></nav>
  </header>

  <div class="check" id="check" role="img" aria-label="Your account statement">
    <div class="ck-row ck-head">
      <div class="bank">Stratton Oakmont, Inc.<small>Long Island, New York</small></div>
      <div class="ck-no" id="ckNo">No. ----</div>
    </div>
    <div class="ck-row ck-date"><span class="lbl">Date</span><span class="fill hand writable w1" id="ckDate"></span></div>
    <div class="ck-row ck-pay">
      <span class="lbl">Pay to the<br>order of</span>
      <span class="fill hand writable w2" id="ckPayee"></span>
      <span class="amt"><span aria-hidden="true">🪙</span><span id="ckAmt">—</span></span>
    </div>
    <div class="ck-row ck-words"><span class="fill hand writable w3" id="ckWords"></span><span class="lbl">coins</span></div>
    <div class="ck-row ck-foot">
      <div class="memo"><span class="lbl">Memo</span><span class="fill hand writable w4" id="ckMemo"></span></div>
      <div class="sig"><span class="hand writable w5">J. Belfort</span><span class="lbl">Authorized signature</span></div>
    </div>
    <div class="stamp" id="stamp" hidden></div>
  </div>
  <p class="note" id="status" role="status">Pulling your file…</p>

  <main id="main" hidden></main>
  <p class="foot">This page is private. Only you can see it.</p>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function n(v){ return Number(v || 0).toLocaleString("en-US"); }
  function dur(s){ s = Math.max(0, Math.floor(s||0)); var d=Math.floor(s/86400), h=Math.floor(s%86400/3600), m=Math.floor(s%3600/60);
    if(d) return d+"d "+h+"h"; if(h) return h+"h "+m+"m"; if(m) return m+"m"; return s+"s"; }
  var ONES=["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
  var TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
  function w999(x){ var out=[], h=Math.floor(x/100), r=x%100;
    if(h) out.push(ONES[h]+" hundred");
    if(r){ out.push(r<20 ? ONES[r] : TENS[Math.floor(r/10)]+(r%10 ? "-"+ONES[r%10] : "")); }
    return out.join(" "); }
  function words(v){ var neg = v < 0, x = Math.floor(Math.abs(v||0));
    if(x === 0) return "Zero";
    var sc=["","thousand","million","billion","trillion","quadrillion"], parts=[], i=0;
    while(x > 0 && i < sc.length){ var c = x % 1000; if(c) parts.unshift(w999(c)+(sc[i] ? " "+sc[i] : "")); x = Math.floor(x/1000); i++; }
    var s = parts.join(" "); s = s.charAt(0).toUpperCase()+s.slice(1);
    return neg ? "Minus "+s.charAt(0).toLowerCase()+s.slice(1) : s; }
  var SUPPORTER = {supporter:"☕ Associate supporter", vip:"💎 Made Man supporter", kingpin:"👑 Kingpin supporter"};
  function roman(k){ var m=[[10,"X"],[9,"IX"],[5,"V"],[4,"IV"],[1,"I"]], s=""; m.forEach(function(p){ while(k>=p[0]){ s+=p[1]; k-=p[0]; } }); return s; }

  function fillCheck(d){
    var name = (d.user && d.user.name) || d.session_username || "Member";
    $("ckDate").textContent = new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
    $("ckPayee").textContent = name;
    var id = (d.user && d.user.id) || "";
    $("ckNo").textContent = "No. " + (id ? id.slice(-4) : "----");
    var stamp = $("stamp");
    if(!d.exists){
      $("ckAmt").textContent = "0"; $("ckWords").textContent = "Zero";
      $("ckMemo").textContent = "";
      stamp.textContent = "Account not opened"; stamp.hidden = false;
    } else {
      var total = (d.money && d.money.total) || 0;
      $("ckAmt").textContent = n(total);
      $("ckWords").textContent = words(total);
      var memo = [];
      if(d.rank) memo.push(d.rank.emoji+" "+d.rank.name);
      if(d.level) memo.push("level "+d.level.level);
      $("ckMemo").textContent = memo.join(", ");
      if(total <= 0){ stamp.textContent = "Insufficient funds"; stamp.hidden = false; }
    }
    $("check").setAttribute("aria-label", "Account statement: pay to the order of "+name+", "+$("ckAmt").textContent+" coins");
    requestAnimationFrame(function(){ $("check").classList.add("written"); });
  }

  function header(d){
    var name = (d.user && d.user.name) || d.session_username || "you";
    $("who").innerHTML = "Signed in as <strong>"+esc(name)+"</strong>";
    if(d.user && d.user.avatar){ var av=$("av"); av.src = d.user.avatar; av.hidden = false; }
    if(d.is_admin) $("adminLink").hidden = false;
  }

  function standing(d){
    var r = d.rank, l = d.level, st = d.status || {}, h = "";
    h += '<div class="standing">';
    if(r){
      var pips=""; for(var i=0;i<=r.of;i++) pips += '<span class="pip'+(i<=r.idx?" on":"")+'"></span>';
      h += '<div><p class="big">'+esc(r.emoji)+' '+esc(r.name)+'</p>'+
           '<div class="pips" role="img" aria-label="City rank '+(r.idx+1)+' of '+(r.of+1)+'">'+pips+'</div>'+
           (r.next ? '<p class="sub">Next: '+esc(r.next.emoji)+' '+esc(r.next.name)+'. '+esc(r.next.req)+'.</p>'
                   : '<p class="sub">Top rank. The city is yours.</p>')+'</div>';
    }
    if(l){
      var span = Math.max(1, l.next - l.floor), got = Math.min(span, Math.max(0, l.xp - l.floor));
      var pct = Math.round(got/span*100);
      h += '<div><p class="big">Level '+n(l.level)+'</p>'+
           '<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'" aria-label="Progress to level '+(l.level+1)+'"><i style="width:'+pct+'%"></i></div>'+
           '<p class="sub">'+n(got)+' of '+n(span)+' XP to level '+n(l.level+1)+'</p></div>';
    }
    h += '</div>';
    var b = [];
    if(st.title) b.push("Title: “"+esc(st.title)+"”");
    if(st.prestige) b.push("⭐ Prestige "+roman(st.prestige));
    if(st.tag_perks) b.push("🏷️ Tag perks on");
    if(st.supporter && SUPPORTER[st.supporter]) b.push(SUPPORTER[st.supporter]);
    if(b.length) h += '<div class="badges">'+b.map(function(x){return "<span>"+x+"</span>";}).join("")+'</div>';
    return h;
  }

  var CATS = [["cash","Cash","--s1"],["business","Businesses","--s2"],["realestate","Property","--s3"],["stocks","Stocks","--s4"],["venues","Venues","--s5"]];
  function money(m){
    if(!m) return '<p class="empty">Your money couldn’t be loaded right now.</p>';
    var pos = CATS.map(function(c){ return Math.max(0, m[c[0]]||0); });
    var sum = pos.reduce(function(a,b){return a+b;}, 0);
    var h = "";
    if(sum > 0){
      h += '<div class="bar" id="nwbar">';
      CATS.forEach(function(c,i){ if(pos[i] <= 0) return;
        var pct = pos[i]/sum*100;
        h += '<div class="seg" tabindex="0" style="flex:'+pos[i]+' 1 0;background:var('+c[2]+')" data-tip="'+esc(c[1]+": "+n(m[c[0]])+" ("+(pct<1?"<1":Math.round(pct))+"%)")+'" aria-label="'+esc(c[1]+" "+n(m[c[0]])+" coins, "+Math.round(pct)+" percent")+'"></div>';
      });
      h += '<div class="tip" id="tip" hidden></div></div>';
    }
    h += '<ul class="legend">';
    CATS.forEach(function(c,i){ var v = m[c[0]]||0, pct = sum>0 ? Math.round(pos[i]/sum*100) : 0;
      h += '<li><span class="sw" style="background:var('+c[2]+')"></span><span>'+c[1]+(c[0]==="realestate"&&v<0?' <span class="r-dim">(mortgage owed)</span>':'')+'</span>'+
           '<span class="v'+(v<0?" loss":"")+'">'+n(v)+'</span><span class="p">'+(sum>0?pct+"%":"")+'</span></li>'; });
    h += '<li class="total"><span></span><span>Net worth</span><span class="v">'+n(m.total)+'</span><span></span></li></ul>';
    if(m.cash_rank) h += '<p class="sub" style="margin-top:10px">#'+n(m.cash_rank)+' in cash out of '+n(m.ranked_of)+' members.</p>';
    if(sum <= 0) h = '<p class="empty">Nothing on the books yet. Claim <code>/daily</code> and start earning.</p>' + h;
    return h;
  }

  function ready(rows){
    if(!rows || !rows.length) return '<p class="empty">No timers to show.</p>';
    rows = rows.slice().sort(function(a,b){ return (a.remaining>0) - (b.remaining>0) || a.remaining - b.remaining; });
    return '<ul class="rows">'+rows.map(function(r){
      return '<li><span class="r-main">'+esc(r.label)+' <span class="r-dim">'+esc(r.cmd)+'</span></span>'+
        (r.remaining>0 ? '<span class="r-side">⏳ '+dur(r.remaining)+'</span>' : '<span class="r-side ok">✓ Ready</span>')+'</li>';
    }).join("")+'</ul>';
  }

  function list(title, items, emptyHtml, rowFn){
    var h = '<h3>'+title+(items && items.length ? ' <span class="count">'+items.length+'</span>' : '')+'</h3>';
    if(!items || !items.length) return h+'<p class="empty">'+emptyHtml+'</p>';
    return h+'<ul class="rows">'+items.map(rowFn).join("")+'</ul>';
  }

  function empire(d){
    var h = "";
    h += list("Businesses", d.businesses, 'No businesses yet. Buy one with <code>/buybusiness</code>.', function(b){
      return '<li><span class="r-main">'+esc(b.emoji)+' '+esc(b.name)+(b.level?' <span class="r-dim">upgrade '+b.level+'</span>':'')+'</span>'+
        (b.closed_for>0 ? '<span class="r-side loss">Closed '+dur(b.closed_for)+'</span>'
                        : '<span class="r-side">'+(b.pending>0?'<span class="gold">'+n(b.pending)+'</span> to collect':'Nothing to collect')+'</span>')+'</li>'; });
    h += list("Venues", d.venues, 'No venues yet. Open one with <code>/buyvenue</code>.', function(v){
      var s = v.closed_for>0 ? '<span class="loss">Closed '+dur(v.closed_for)+'</span>'
            : v.celebrity_for>0 ? '<span class="gold">⭐ Celebrity night, '+dur(v.celebrity_for)+'</span>' : 'Open';
      return '<li><span class="r-main">'+esc(v.emoji)+' '+esc(v.name)+' <span class="r-dim">rep '+v.rep+'</span></span><span class="r-side">'+s+'</span></li>'; });
    h += list("Stocks", d.stocks, 'No shares yet. Trade with <code>/stocks</code>.', function(s){
      return '<li><span class="r-main">'+esc(s.emoji)+' '+esc(s.ticker)+' <span class="r-dim">'+n(s.shares)+' shares</span></span><span class="r-side">'+n(s.value)+'</span></li>'; });
    h += '<h3>Property and pet</h3><ul class="rows">';
    h += '<li><span class="r-main">🏘️ Real estate</span><span class="r-side">'+(d.properties ? n(d.properties)+(d.properties===1?" property":" properties") : 'None yet. See <code>/realestate</code>')+'</span></li>';
    h += '<li><span class="r-main">🐾 Pet</span><span class="r-side">'+(d.pet ? esc(d.pet.emoji)+' '+esc(d.pet.name)+', level '+d.pet.level : 'None. Adopt one with <code>/adopt</code>')+'</span></li>';
    return h+'</ul>';
  }

  function record(r){
    if(!r) return '<p class="empty">Your record couldn’t be loaded right now.</p>';
    return '<dl class="figs"><div><dt>Games won</dt><dd>'+n(r.games_won)+'</dd></div><div><dt>Games lost</dt><dd>'+n(r.games_lost)+'</dd></div>'+
      '<div><dt>Earned, all time</dt><dd>'+n(r.total_earned)+'</dd></div><div><dt>Lost, all time</dt><dd class="loss">'+n(r.total_lost)+'</dd></div></dl>';
  }

  function web(d){
    var h = '<ul class="rows">';
    var c = d.crew;
    h += '<li><span class="r-main">🏴 Crew</span><span class="r-side">'+(c ? esc("["+c.tag+"] "+c.name)+', '+esc(c.role.toLowerCase())+' of '+c.members : 'None. Start one with <code>_createcrew</code>')+'</span></li>';
    h += '<li><span class="r-main">💍 Married to</span><span class="r-side">'+(d.spouse ? esc(d.spouse) : 'Nobody')+'</span></li>';
    h += '</ul>';
    var f = d.fmk;
    h += '<h3>FMK record</h3>';
    if(!f || !(f.fuck.count + f.marry.count + f.kill.count)) return h+'<p class="empty">Nobody has FMK’d you yet.</p>';
    function line(icon, label, x){ return '<li><span class="r-main">'+icon+' '+label+' <span class="r-dim">'+x.count+'</span><br>'+
      (x.count ? esc(x.names.join(", "))+(x.count>x.names.length?' and '+(x.count-x.names.length)+' more':'') : '<span class="r-dim">nobody</span>')+'</span></li>'; }
    return h+'<ul class="rows fmk">'+line("💋","Fucked by",f.fuck)+line("💍","Married by",f.marry)+line("🔪","Killed by",f.kill)+'</ul>';
  }

  function achievements(a){
    if(!a) return '<p class="empty">Achievements couldn’t be loaded right now.</p>';
    var h = '<p class="sub">'+a.earned.length+' of '+a.total+' earned</p>';
    h += '<div class="meter" role="progressbar" aria-valuemin="0" aria-valuemax="'+a.total+'" aria-valuenow="'+a.earned.length+'" aria-label="Achievements earned"><i style="width:'+Math.round(a.earned.length/Math.max(1,a.total)*100)+'%"></i></div>';
    if(a.earned.length) h += '<ul class="chips" style="margin-top:12px">'+a.earned.map(function(x){ return '<li title="'+esc(x.desc)+'">'+esc(x.emoji)+' '+esc(x.name)+'</li>'; }).join("")+'</ul>';
    if(a.locked.length) h += '<h3>Up next</h3><ul class="rows up">'+a.locked.map(function(x){ return '<li><span class="r-main">🔒 '+esc(x.name)+' <span class="r-dim">'+esc(x.desc)+'</span></span></li>'; }).join("")+'</ul>';
    return h;
  }

  function memory(m){
    if(!m) return '<p class="empty">Couldn’t load this right now.</p>';
    if(m.opted_out) return '<p class="empty">Memory is off, so Jordan isn’t keeping a file on you. Turn it on in Discord with <code>_memory on</code>.</p>';

      for (var b = 0; b < 12; b++) s += '<circle cx="' + (34 + b * 23) + '" cy="160" r="4" fill="#FFE7A3" style="animation:a-twinkle .8s ' + (b * .07) + 's infinite"/>';
    } else if (id === "flappy"){
      s += '<defs>' + grad("bg", "#1B0738", "#0B0420", 1) + '</defs><rect width="320" height="180" fill="url(#bg' + u + ')"/>';
      for (var st2 = 0; st2 < 18; st2++) s += '<circle cx="' + (st2 * 37 % 320) + '" cy="' + (st2 * 53 % 120) + '" r="1.2" fill="#fff" style="animation:a-twinkle ' + (1.5 + st2 % 3) + 's infinite"/>';
      s += '<g style="animation:a-scrollL 4.8s linear infinite">';
      [[40, 50], [120, 70], [200, 40], [280, 64], [360, 50], [440, 70], [520, 40], [600, 64]].forEach(function(p, i){
        var c = i % 2 ? "#FF4D6D" : "#39E58C";
        s += '<rect x="' + p[0] + '" y="0" width="26" height="' + p[1] + '" rx="4" fill="' + c + '"/><rect x="' + p[0] + '" y="' + (p[1] + 62) + '" width="26" height="' + (180 - p[1] - 62) + '" rx="4" fill="' + c + '"/>' +
             '<line x1="' + (p[0] + 13) + '" y1="' + (p[1] - 8) + '" x2="' + (p[0] + 13) + '" y2="' + p[1] + '" stroke="' + c + '" stroke-width="3"/>';
      });
      s += '</g><g style="animation:a-bob .9s ease-in-out infinite"><circle cx="110" cy="92" r="13" fill="#FFD23F"/><circle cx="115" cy="88" r="4" fill="#fff"/><circle cx="116" cy="88" r="2" fill="#111"/><polygon points="122,93 132,95 122,98" fill="#FF8A3D"/>' +
           '<ellipse cx="103" cy="95" rx="8" ry="5" fill="#F0B400" style="animation:a-flap .3s ease-in-out infinite"/></g>';
    } else if (id === "wildkin"){
      s += '<rect width="320" height="180" fill="#E0F8D0"/><g shape-rendering="crispEdges">';
      s += '<path d="M0 110h40v-10h30v-14h40v14h30v10h40v-20h40v20h40v-8h60v118H0z" fill="#88C070"/>';
      for (var tx2 = 0; tx2 < 320; tx2 += 16) s += '<rect x="' + tx2 + '" y="128" width="16" height="52" fill="' + (tx2 % 32 ? "#346856" : "#3E7A64") + '"/>';
      [[20, 50], [70, 40], [240, 46], [286, 54]].forEach(function(p){ s += '<rect x="' + p[0] + '" y="' + p[1] + '" width="24" height="24" fill="#346856"/><rect x="' + (p[0] + 4) + '" y="' + (p[1] - 8) + '" width="16" height="10" fill="#346856"/><rect x="' + (p[0] + 9) + '" y="' + (p[1] + 24) + '" width="6" height="14" fill="#081820"/>'; });
      for (var gr2 = 0; gr2 < 10; gr2++) s += '<g style="transform-origin:' + (gr2 * 32 + 8) + 'px 140px;transform-box:view-box;animation:a-sway ' + (1.6 + gr2 % 3 * .3) + 's ease-in-out infinite"><path d="M' + (gr2 * 32) + ' 140l4-10 4 10 4-12 4 12z" fill="#081820"/></g>';
      s += '<g style="animation:a-hop 2.4s ease-in-out infinite"><rect x="142" y="104" width="36" height="24" fill="#081820"/><rect x="146" y="100" width="28" height="8" fill="#081820"/><rect x="150" y="108" width="20" height="14" fill="#88C070"/>' +
           '<rect x="152" y="110" width="4" height="4" fill="#081820"/><rect x="164" y="110" width="4" height="4" fill="#081820"/><rect x="146" y="92" width="6" height="10" fill="#081820"/><rect x="168" y="92" width="6" height="10" fill="#081820"/></g>';
      s += '</g><rect width="320" height="180" fill="url(#scan' + u + ')" opacity=".35"/><defs><pattern id="scan' + u + '" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="2" fill="#081820" opacity=".18"/></pattern></defs>';
      s += '<text x="300" y="36" text-anchor="end" font-family="Bungee,Impact,sans-serif" font-size="12" fill="#081820">LV 24</text>';
    } else if (id === "paintball"){
      s += '<defs>' + grad("bg", "#2A0F4F", "#145C3B", 1) + '<radialGradient id="flood' + u + '" cx=".2" cy="0" r=".9"><stop offset="0" stop-color="#FFF3D0" stop-opacity=".45"/><stop offset="1" stop-color="#FFF3D0" stop-opacity="0"/></radialGradient></defs>';
      s += '<rect width="320" height="180" fill="url(#bg' + u + ')"/><rect width="320" height="180" fill="url(#flood' + u + ')"/><rect y="98" width="320" height="82" fill="#1E7A4B"/><rect y="98" width="320" height="6" fill="#246A45"/>';
      [[60, 70, 54], [160, 66, 60], [260, 70, 54]].forEach(function(b){ s += '<rect x="' + (b[0] - b[2] / 2) + '" y="' + b[1] + '" width="' + b[2] + '" height="' + (b[2] * .9) + '" rx="' + (b[2] * .28) + '" fill="#5B47D6" stroke="#1A0F40" stroke-width="2"/><rect x="' + (b[0] - b[2] / 2) + '" y="' + (b[1] + b[2] * .28) + '" width="' + b[2] + '" height="6" fill="#FFD23F" opacity=".85"/>'; });
      var splats = [[60, 86, "#FF3D9A", 0], [170, 82, "#3DE0FF", 1.2], [258, 92, "#FF3D9A", 2.4], [148, 96, "#FFD23F", 3.4]];
      splats.forEach(function(p){ s += '<g style="transform-origin:' + p[0] + 'px ' + p[1] + 'px;transform-box:view-box;animation:a-pop 4.6s ' + p[3] + 's infinite"><circle cx="' + p[0] + '" cy="' + p[1] + '" r="13" fill="' + p[2] + '"/><circle cx="' + (p[0] + 14) + '" cy="' + (p[1] - 9) + '" r="4" fill="' + p[2] + '"/><circle cx="' + (p[0] - 15) + '" cy="' + (p[1] + 6) + '" r="3.5" fill="' + p[2] + '"/><rect x="' + (p[0] - 3) + '" y="' + p[1] + '" width="5" height="18" rx="2.5" fill="' + p[2] + '"/><circle cx="' + (p[0] + 9) + '" cy="' + (p[1] + 11) + '" r="3" fill="' + p[2] + '"/></g>'; });
      s += '<circle cx="40" cy="170" r="5" fill="#FF3D9A" style="--bx:120px;--by:-80px;animation:a-ball 2.3s .3s infinite"/><circle cx="300" cy="168" r="5" fill="#3DE0FF" style="--bx:-130px;--by:-90px;animation:a-ball 2.3s 1.4s infinite"/>';
    }
    return s + '</svg>';
  }

  function arcade(g){
    g = g || {};
    var playedN = GAMES.filter(function(x){ return x.played(g[x.id]); }).length;
    var C = 2 * Math.PI * 19, off = C * (1 - playedN / GAMES.length);
    var h = '<section class="arcade" id="arcade" aria-labelledby="arTitle"><div class="ar-beams"></div><div class="ar-sparks" id="arSparks"></div>';
    h += '<div class="ar-head"><div class="ar-sign" id="arSign"><span class="ar-bulbs" id="arBulbs" aria-hidden="true"></span><h2 class="ar-title" id="arTitle">THE ARCADE</h2></div>' +
         '<div class="ar-meta"><div class="ar-ring"><svg viewBox="0 0 46 46" aria-hidden="true"><defs><linearGradient id="ar-goldgrad"><stop offset="0" stop-color="#FFE7A3"/><stop offset="1" stop-color="#B8923A"/></linearGradient></defs>' +
         '<circle class="bgc" cx="23" cy="23" r="19"/><circle class="fgc" id="arRing" cx="23" cy="23" r="19" stroke-dasharray="' + C.toFixed(1) + '" stroke-dashoffset="' + C.toFixed(1) + '" data-off="' + off.toFixed(1) + '"/></svg>' +
         '<p class="big"><b>' + playedN + '</b> of ' + GAMES.length + ' games played</p></div><p class="sub">' + (playedN < GAMES.length ? 'Try them all. Seven are free to play.' : 'Every game tried. Respect.') + '</p></div></div>';
    // spotlight
    h += '<div class="ar-spot" id="arSpot" aria-roledescription="carousel" aria-label="Featured games">';
    SPOTLIGHT.forEach(function(sp, i){
      var G = GAMES.filter(function(x){ return x.id === sp.id; })[0];
      h += '<div class="ar-slide' + (i === 0 ? ' on' : '') + '" style="--acc:' + G.acc + '" aria-roledescription="slide" aria-label="' + (i + 1) + ' of ' + SPOTLIGHT.length + '"' + (i ? ' aria-hidden="true"' : '') + '>' +
           '<div class="ar-art">' + scene(G.id, "s") + '</div><div class="ar-copy"><span class="ar-kicker">' + esc(sp.kicker) + '</span><h3>' + esc(sp.title) + '</h3><p>' + esc(sp.text) + '</p>' +
           '<div class="ar-cta"><a class="ar-btn" href="' + G.href + '"' + (i ? ' tabindex="-1"' : '') + '>' + esc(sp.cta) + ' <span aria-hidden="true">→</span></a>' +
           (sp.alt ? '<a class="ar-btn ghost" href="' + sp.alt[1] + '"' + (i ? ' tabindex="-1"' : '') + '>' + esc(sp.alt[0]) + '</a>' : '') + '</div></div></div>';
    });
    h += '<div class="ar-dots">' + SPOTLIGHT.map(function(sp, i){ return '<button type="button" class="ar-dot' + (i === 0 ? ' on' : '') + '" data-i="' + i + '" aria-label="Show ' + esc(sp.title.toLowerCase()) + '"><i></i></button>'; }).join("") + '</div></div>';
    // filters
    h += '<div class="ar-filters" role="toolbar" aria-label="Filter games"><span class="ar-pill" id="arPill"></span>' + GCATS.map(function(c, i){
      var ct = c.id === "all" ? GAMES.length : GAMES.filter(function(x){ return x.cats.indexOf(c.id) >= 0; }).length;
      return '<button type="button" class="ar-chip" data-cat="' + c.id + '" aria-pressed="' + (i === 0) + '"><span aria-hidden="true">' + c.icon + '</span>' + c.label + '<span class="ct">' + ct + '</span></button>';
    }).join("") + '</div>';
    // cards
    h += '<div class="ar-grid" id="arGrid">';
    GAMES.forEach(function(G, i){
      var s = g[G.id], m = G.meter ? G.meter(s) : null;
      h += '<a class="ar-card" href="' + G.href + '" data-cats="' + G.cats.join(" ") + '" style="--acc:' + G.acc + ';--acc2:' + G.acc2 + ';--i:' + i + '" aria-label="' + esc(G.name) + ': play">' +
           '<div class="ar-art">' + scene(G.id, "c") + (G.badge ? '<span class="ar-badge' + (G.badge === "UPDATED" ? ' upd' : '') + '">' + G.badge + '</span>' : '') + '</div>' +
           '<span class="ar-emoji" aria-hidden="true">' + G.emoji + '</span>' +
           '<div class="ar-body"><h3 class="ar-name">' + esc(G.name) + '</h3>' +
           '<div class="ar-tags">' + G.tags.map(function(t, k){ return '<span class="ar-tag' + (k === 0 ? ' hot' : '') + '">' + TAGNAME[t] + '</span>'; }).join("") + '</div>' +
           '<p class="ar-blurb">' + esc(G.blurb) + '</p><p class="ar-stat">' + G.stat(s) + '</p>' +
           (m ? '<div class="ar-meter" role="progressbar" aria-label="Coins paid today" aria-valuemin="0" aria-valuemax="' + m[1] + '" aria-valuenow="' + m[0] + '"><i data-w="' + Math.min(100, Math.round(m[0] / Math.max(1, m[1]) * 100)) + '%"></i></div><div class="ar-meter-l"><span>Paid today</span><span>' + n(m[0]) + ' / ' + n(m[1]) + '</span></div>' : '') +
           '<div class="ar-play"><span>' + (G.cats.indexOf("free") >= 0 ? (G.id === "paintball" ? "🎁 Free · optional wagers" : G.id === "kart" ? "🎁 Free · optional entry fees" : "🎁 Free · pays coins") : "🪙 Bet your coins") + '</span><span>Play <span aria-hidden="true">▸</span></span></div></div>' +
           '<span class="ar-glare"></span></a>';
    });
    h += '</div></section>';
    return h;
  }

  function wireArcade(){
    var root = $("arcade"); if (!root) return;
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    // sparks
    if (!reduce){ var sp = $("arSparks"), sh = ""; for (var i = 0; i < 16; i++) sh += '<i style="left:' + (Math.random() * 100).toFixed(1) + '%;animation-duration:' + (6 + Math.random() * 7).toFixed(1) + 's;animation-delay:' + (-Math.random() * 10).toFixed(1) + 's"></i>'; sp.innerHTML = sh; }
    // marquee bulbs around the sign, chasing clockwise
    var sign = $("arSign"), bulbs = $("arBulbs"), lastW = 0, lastH = 0;
    function layBulbs(){
      var w = sign.offsetWidth, h = sign.offsetHeight, d = 10; if (!w || (w === lastW && h === lastH)) return; lastW = w; lastH = h;
      var pts = [], nx = Math.max(2, Math.round((w - 2 * d) / 17)), ny = Math.max(1, Math.round((h - 2 * d) / 17)), k;
      for (k = 0; k < nx; k++) pts.push([d + (w - 2 * d) * k / nx, d]);
      for (k = 0; k < ny; k++) pts.push([w - d, d + (h - 2 * d) * k / ny]);
      for (k = 0; k < nx; k++) pts.push([w - d - (w - 2 * d) * k / nx, h - d]);
      for (k = 0; k < ny; k++) pts.push([d, h - d - (h - 2 * d) * k / ny]);
      bulbs.innerHTML = pts.map(function(p, i){ return '<i style="left:' + p[0].toFixed(1) + 'px;top:' + p[1].toFixed(1) + 'px;animation-delay:' + (-(2 - i % 3) * .35).toFixed(2) + 's"></i>'; }).join("");
    }
    layBulbs();
    if (window.ResizeObserver) new ResizeObserver(layBulbs).observe(sign); else window.addEventListener("resize", layBulbs);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(layBulbs);
    var cards = Array.prototype.slice.call(root.querySelectorAll(".ar-card"));
    // reveal on scroll + pause scenes that are off screen
    function reveal(el){ el.classList.add("in"); var mi = el.querySelector(".ar-meter i"); if (mi) mi.style.width = mi.getAttribute("data-w"); }
    if ("IntersectionObserver" in window){
      var io = new IntersectionObserver(function(es){ es.forEach(function(e){
        if (e.isIntersecting){ reveal(e.target); e.target.classList.remove("ar-pause"); } else e.target.classList.add("ar-pause");
      }); }, {rootMargin: "0px 0px -40px 0px", threshold: .12});
      cards.forEach(function(c){ io.observe(c); });
      var ro = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting){ var r = $("arRing"); r.style.strokeDashoffset = r.getAttribute("data-off"); ro.disconnect(); } }); }, {threshold: .6});
      ro.observe(root.querySelector(".ar-meta"));
    } else { cards.forEach(reveal); $("arRing").style.strokeDashoffset = $("arRing").getAttribute("data-off"); }
    // tilt + glare (mouse / pen only)
    if (!reduce && window.matchMedia && matchMedia("(hover: hover) and (pointer: fine)").matches){
      cards.forEach(function(c){
        c.addEventListener("pointermove", function(e){
          var r = c.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
          c.classList.add("tilting");
          c.style.transform = "perspective(900px) rotateX(" + ((.5 - y) * 10).toFixed(2) + "deg) rotateY(" + ((x - .5) * 12).toFixed(2) + "deg) translateY(-6px)";
          c.style.setProperty("--gx", (x * 100).toFixed(1) + "%"); c.style.setProperty("--gy", (y * 100).toFixed(1) + "%");
        });
        c.addEventListener("pointerleave", function(){ c.classList.remove("tilting"); c.style.transform = ""; });
      });
    }
    // filters: the pill slides to the chip, cards glide into their new spots (FLIP)
    var pill = $("arPill"), chips = Array.prototype.slice.call(root.querySelectorAll(".ar-chip"));
    function movePill(ch, instant){ if (instant) pill.style.transition = "none"; pill.style.width = ch.offsetWidth + "px"; pill.style.height = ch.offsetHeight + "px"; pill.style.transform = "translate(" + ch.offsetLeft + "px," + ch.offsetTop + "px)"; if (instant){ pill.offsetWidth; pill.style.transition = ""; } }
    movePill(chips[0], true);
    window.addEventListener("resize", function(){ var on = root.querySelector('.ar-chip[aria-pressed="true"]'); if (on) movePill(on, true); });
    var busy = false;
    function applyFilter(cat){
      if (busy) return; busy = true;
      var keep = function(c){ return cat === "all" || c.getAttribute("data-cats").split(" ").indexOf(cat) >= 0; };
      var leaving = cards.filter(function(c){ return !c.classList.contains("ar-hidden") && !keep(c); });
      var entering = cards.filter(function(c){ return c.classList.contains("ar-hidden") && keep(c); });
      leaving.forEach(function(c){ c.classList.add("out"); });
      setTimeout(function(){
        var stay = cards.filter(function(c){ return !c.classList.contains("ar-hidden") && keep(c); });
        var first = stay.map(function(c){ return c.getBoundingClientRect(); });
        leaving.forEach(function(c){ c.classList.add("ar-hidden"); c.classList.remove("out"); });
        entering.forEach(function(c){ c.classList.remove("ar-hidden"); c.classList.add("out"); });
        stay.forEach(function(c, i){ var l = c.getBoundingClientRect(), dx = first[i].left - l.left, dy = first[i].top - l.top;
          if (dx || dy){ c.style.transition = "none"; c.style.transform = "translate(" + dx + "px," + dy + "px)"; } });
        root.offsetWidth;
        stay.forEach(function(c){ c.style.transition = "transform .55s cubic-bezier(.2,.8,.2,1)"; c.style.transform = ""; });
        entering.forEach(function(c, i){ setTimeout(function(){ c.classList.remove("out"); reveal(c); }, 60 + i * 50); });
        setTimeout(function(){ stay.forEach(function(c){ c.style.transition = ""; }); busy = false; }, 600);
      }, leaving.length ? 170 : 0);
    }
    chips.forEach(function(ch){ ch.addEventListener("click", function(){
      if (ch.getAttribute("aria-pressed") === "true") return;
      chips.forEach(function(x){ x.setAttribute("aria-pressed", String(x === ch)); });
      movePill(ch); var fl = ch.parentNode; if (fl.scrollWidth > fl.clientWidth) fl.scrollTo({left: ch.offsetLeft - (fl.clientWidth - ch.offsetWidth) / 2, behavior: reduce ? "auto" : "smooth"});
      applyFilter(ch.getAttribute("data-cat"));
    }); });
    // spotlight carousel
    var spot = $("arSpot"), slides = spot.querySelectorAll(".ar-slide"), dots = spot.querySelectorAll(".ar-dot"), cur = 0, timer = 0, MS = 6500;
    spot.style.setProperty("--spot-ms", MS + "ms");
    function go(i){
      slides[cur].classList.remove("on"); slides[cur].setAttribute("aria-hidden", "true"); dots[cur].classList.remove("on");
      slides[cur].querySelectorAll("a").forEach(function(a){ a.setAttribute("tabindex", "-1"); });
      cur = (i + slides.length) % slides.length;
      slides[cur].classList.add("on"); slides[cur].removeAttribute("aria-hidden");
      slides[cur].querySelectorAll("a").forEach(function(a){ a.removeAttribute("tabindex"); });
      var d = dots[cur]; d.classList.remove("on"); d.offsetWidth; d.classList.add("on");
      arm();
    }
    function arm(){ clearTimeout(timer); if (!reduce && !spot.classList.contains("paused")) timer = setTimeout(function(){ go(cur + 1); }, MS); }
    dots.forEach(function(d){ d.addEventListener("click", function(){ go(+d.getAttribute("data-i")); }); });
    spot.addEventListener("pointerenter", function(e){ if (e.pointerType === "mouse"){ spot.classList.add("paused"); clearTimeout(timer); } });
    spot.addEventListener("pointerleave", function(e){ if (e.pointerType === "mouse"){ spot.classList.remove("paused"); go(cur); } });
    spot.addEventListener("focusin", function(){ spot.classList.add("paused"); clearTimeout(timer); });
    spot.addEventListener("focusout", function(){ spot.classList.remove("paused"); arm(); });
    var sx = null;
    spot.addEventListener("touchstart", function(e){ sx = e.touches[0].clientX; }, {passive: true});
    spot.addEventListener("touchend", function(e){ if (sx == null) return; var dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) go(cur + (dx < 0 ? 1 : -1)); sx = null; });
    document.addEventListener("visibilitychange", function(){ if (document.hidden) clearTimeout(timer); else arm(); });
    arm();
  }

  function sec(title, body){ return '<section class="sec"><h2>'+title+'</h2>'+body+'</section>'; }

  function render(d){
    header(d); fillCheck(d);
    var main = $("main");
    if(!d.exists){
      main.innerHTML = sec("Open your account", '<p class="empty">You’re not on the books yet. Claim <code>/daily</code> in the server and this page fills in.</p>');
    } else {
      main.innerHTML = standing(d) + arcade(d.games) +
        '<div class="cols"><div>' +
          sec("Ready now", ready(d.cooldowns)) +
          sec("Where your money sits", money(d.money)) +
          sec("Your empire", empire(d) + '<p class="sub" style="margin-top:10px"><a href="/city">Run it from the city map →</a></p>') +
          sec("Your record", record(d.record)) +
        '</div><div>' +
          sec("Your web", web(d)) +
          sec("Achievements", achievements(d.achievements)) +
          sec("What Jordan remembers", memory(d.memory)) +
        '</div></div>';
      wireTips(); wireArcade();
    }
    main.hidden = false;
    $("status").hidden = true;
  }

  function wireTips(){
    var bar = $("nwbar"), tip = $("tip"); if(!bar || !tip) return;
    function show(e){ var s = e.currentTarget; tip.textContent = s.getAttribute("data-tip");
      tip.style.left = (s.offsetLeft + s.offsetWidth/2)+"px"; tip.style.top = "0px"; tip.hidden = false; }
    function hide(){ tip.hidden = true; }
    bar.querySelectorAll(".seg").forEach(function(s){
      s.addEventListener("pointerenter", show); s.addEventListener("focus", show);
      s.addEventListener("pointerleave", hide); s.addEventListener("blur", hide); });
  }

  function fail(msg){
    $("status").hidden = true;
    var main = $("main");
    main.innerHTML = '<div class="err"><p class="empty">'+esc(msg)+'</p><button type="button" id="retry">Try again</button></div>';
    main.hidden = false;
    $("retry").addEventListener("click", function(){ location.reload(); });
  }

  fetch("/api/me", {credentials:"same-origin", cache:"no-store"})
    .then(function(r){ if(r.status === 401){ location.href = "/auth/login"; throw null; } return r.json(); })
    .then(function(d){ if(!d || d.ok === false){ fail((d && d.error) || "Couldn’t load your dashboard."); return; } render(d); })
    .catch(function(e){ if(e !== null) fail("Couldn’t reach the server. Check your connection and try again."); });
})();
</script>
