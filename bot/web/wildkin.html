<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B1530">
<title>Wildkin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B1530;--ink:#EDE8FF;--muted:#A99FCB;--faint:#7A6FA0;--shell:#D9D3C7;--shell2:#BFB7A8;--shell3:#8E8676;--accent:#7A3A8C;--pix:"Press Start 2P",monospace}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:radial-gradient(900px 600px at 50% -10%,rgba(122,58,140,.35),transparent 70%),var(--bg);color:var(--ink);
  font:400 14px/1.5 "IBM Plex Sans",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;overflow-x:hidden;touch-action:manipulation}
a{color:#C9B8FF}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:760px;margin:0 auto;padding:10px 14px}
.top h1{font:400 12px/1 var(--pix);margin:0;color:#B9F5A0;letter-spacing:.06em}
.top .bal{font-size:13px;color:var(--muted)} .top .bal b{color:var(--ink);font-family:"IBM Plex Mono",monospace}
.wrap{display:flex;flex-direction:column;align-items:center;padding:0 10px 30px}

/* the handheld */
.shell{position:relative;width:min(100%,430px);border-radius:16px 16px 64px 16px;padding:18px 18px 26px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;
  background:linear-gradient(160deg,#E7E1D6 0%,var(--shell) 45%,var(--shell2) 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 -6px 0 rgba(0,0,0,.08),0 24px 60px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.25)}
.bezel{background:linear-gradient(180deg,#4C4A60,#3A384C);border-radius:10px 10px 36px 10px;padding:14px 22px 22px;position:relative;box-shadow:inset 0 2px 6px rgba(0,0,0,.6)}
.bezel .lbl{display:flex;align-items:center;gap:8px;font:400 7px/1 var(--pix);color:#9C98B8;letter-spacing:.08em;margin:0 0 8px 2px}
.bezel .lbl i{display:block;height:2px;flex:1;background:linear-gradient(90deg,#7A3A8C,#3B5DC9)}
.led{position:absolute;left:8px;top:58px;width:7px;height:7px;border-radius:50%;background:#3A2030;box-shadow:inset 0 1px 1px rgba(0,0,0,.6)}
.led.on{background:#FF4B5C;box-shadow:0 0 8px #FF4B5C}
.led + span{position:absolute;left:4px;top:70px;font:400 5px/1 var(--pix);color:#8C88A8}
canvas#screen{display:block;width:100%;aspect-ratio:160/144;image-rendering:pixelated;image-rendering:crisp-edges;background:#E0F8D0;border-radius:2px;box-shadow:0 0 0 2px #2A2838}
.brand{font:400 15px/1 var(--pix);color:#4B3F8F;margin:14px 0 0 4px;letter-spacing:.02em;font-style:italic;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.brand small{font-size:7px;font-style:normal;color:#6E6690;margin-left:6px}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding:0 4px;touch-action:none}
.dpad{position:relative;width:118px;height:118px}
.dpad button{all:unset;position:absolute;width:40px;height:40px;background:#2C2A36;pointer-events:none}
.dpad .dhit{position:absolute;inset:-18px;z-index:2;cursor:pointer;touch-action:none;border-radius:50%}
.dpad .u{left:39px;top:0;border-radius:6px 6px 0 0}.dpad .d{left:39px;bottom:0;border-radius:0 0 6px 6px}
.dpad .l{left:0;top:39px;border-radius:6px 0 0 6px}.dpad .r{right:0;top:39px;border-radius:0 6px 6px 0}
.dpad .c{left:39px;top:39px;width:40px;height:40px;background:#2C2A36}
.dpad .c::after{content:"";position:absolute;inset:12px;border-radius:50%;background:radial-gradient(circle,#23212C,#2C2A36)}
.dpad button.down{background:#1B1A22}
.ab{display:flex;gap:14px;transform:rotate(-24deg);margin-right:4px}
.ab button{all:unset;position:relative;cursor:pointer;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#C2457E,#8E1F55 70%);box-shadow:0 4px 0 #5D1037,0 6px 10px rgba(0,0,0,.35);
  font:400 10px/52px var(--pix);color:rgba(255,255,255,.55);text-align:center;touch-action:none}
.ab button.down{transform:translateY(3px);box-shadow:0 1px 0 #5D1037}
.ab button::before{content:"";position:absolute;inset:-9px;border-radius:50%}
.ab .b{margin-top:22px}
.ss{display:flex;justify-content:center;gap:22px;margin-top:20px;transform:rotate(-24deg) translateX(-10px);touch-action:none}
.ss button{all:unset;position:relative;cursor:pointer;width:46px;height:12px;border-radius:8px;background:#8E8676;box-shadow:inset 0 2px 2px rgba(0,0,0,.35);touch-action:none}
.ss label{display:block;font:400 6px/1 var(--pix);color:#6E6690;text-align:center;margin-top:7px}
.ss button.down{background:#6B6456}
.ss button::before{content:"";position:absolute;inset:-14px -8px}
.grille{position:absolute;right:26px;bottom:28px;display:flex;gap:7px;transform:rotate(-30deg)}
.grille i{display:block;width:5px;height:44px;border-radius:3px;background:#A69E8E;box-shadow:inset 0 2px 2px rgba(0,0,0,.35)}
.help{max-width:430px;margin:16px auto 0;color:var(--muted);font-size:12px;text-align:center;line-height:1.6}
.help kbd{font:600 11px "IBM Plex Mono",monospace;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:4px;padding:1px 5px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2A2140;border:1px solid #7A3A8C;border-radius:10px;padding:8px 14px;font-size:13px;z-index:9;max-width:90%}
@media (hover:hover) and (pointer:fine){ .shell{width:min(100%,520px)} }
@media (hover:none){ .help .keys{display:none} }
@media (max-width:420px){ .led,.led + span{display:none} .shell{padding:14px 12px 20px} .bezel{padding:10px 14px 16px} .dpad{width:108px;height:108px} .dpad button{width:36px;height:36px} .dpad .u,.dpad .d,.dpad .c{left:36px} .dpad .l,.dpad .r,.dpad .c{top:36px} .ab button{width:48px;height:48px;line-height:48px} }
</style>
</head>
<body>
<div class="top"><a href="/me">Your dashboard</a><h1>WILDKIN</h1><span class="bal">Coins <b id="bal">—</b></span></div>
<div class="wrap">
  <div class="shell" id="shell">
    <div class="bezel">
      <div class="lbl"><i></i>4-SHADE POCKET DISPLAY<i></i></div>
      <span class="led" id="led"></span><span>BATTERY</span>
      <canvas id="screen" width="160" height="144" aria-label="Wildkin game screen"></canvas>
    </div>
    <div class="brand">Wildkin<small>POCKET EDITION</small></div>
    <div class="pad">
      <div class="dpad" aria-label="Direction pad">
        <button class="u" data-k="up" aria-label="Up"></button><button class="l" data-k="left" aria-label="Left"></button>
        <span class="c"></span>
        <button class="r" data-k="right" aria-label="Right"></button><button class="d" data-k="down" aria-label="Down"></button>
        <div class="dhit" aria-hidden="true"></div>
      </div>
      <div class="ab"><button class="b" data-k="b" aria-label="B">B</button><button class="a" data-k="a" aria-label="A">A</button></div>
    </div>
    <div class="ss"><div><button data-k="select" aria-label="Select"></button><label>SELECT</label></div><div><button data-k="start" aria-label="Start"></button><label>START</label></div></div>
    <div class="grille" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </div>
  <p class="help"><span class="keys">Move <kbd>←↑→↓</kbd> / <kbd>WASD</kbd> · A <kbd>Z</kbd> / <kbd>Space</kbd> · B <kbd>X</kbd> (hold to run) · Start <kbd>Enter</kbd><br></span>Hold B to run. Battles, catches and coins are saved on the server — pick it up on any device.</p>
</div>
<div class="toast" id="toast" hidden></div>

function glyphTo(x, s, px, py, ci){ for (var i = 0; i < s.length; i++) if (s[i] !== " ") x.drawImage(glyphCanvas(s.charCodeAt(i), ci), px + i * 8, py); }
Object.keys(BUILDINGS).forEach(function(kind){
  art("bld_" + kind, function(){
    var B = BUILDINGS[kind], W = B.w * 16, H = B.h * 16, o = canvasOf(W, H), p = painter(o.x), R = B.roof;
    // roof
    p.r(3, 1, 0, W - 2, R + 1).r(2, 2, 1, W - 4, R - 1);
    for (var y = 4; y < R - 1; y += 5) p.r(3, 2, y, W - 4, 1);
    for (var y2 = 1; y2 < R - 1; y2 += 5) for (var x2 = (y2 % 10 === 1 ? 6 : 2); x2 < W - 3; x2 += 8) p.r(3, x2, y2, 1, 4);
    p.r(1, 2, 1, W - 4, 1).r(3, 0, R - 1, W, 2);
    if (kind === "hall" || kind === "arena"){ p.r(1, W / 2 - 1, 0, 2, R - 2); }   // ridge beam
    // walls
    p.r(3, 1, R + 1, W - 2, H - R - 1).r(0, 2, R + 1, W - 4, H - R - 2);
    for (var x3 = 8; x3 < W - 4; x3 += 8) p.r(1, x3, R + 2, 1, H - R - 3);
    // door
    var dx = B.door * 16 + 2;
    p.r(3, dx - 1, H - 15, 14, 15).r(B.locked ? 3 : 2, dx, H - 14, 12, 14).r(1, dx + 9, H - 8, 2, 2);
    if (B.locked){ p.r(1, dx + 2, H - 12, 8, 1).r(1, dx + 2, H - 9, 8, 1).r(1, dx + 2, H - 6, 8, 1); }
    // windows on any tile that isn't the door
    for (var t = 0; t < B.w; t++){
      if (t === B.door || (B.w >= 5 && (t === 0 || t === B.w - 1) && kind !== "inn")) continue;
      var wx = t * 16 + 3, wy = H - 13;
      p.r(3, wx, wy, 10, 8).r(1, wx + 1, wy + 1, 8, 6).r(0, wx + 1, wy + 1, 3, 2).r(3, wx + 4, wy + 1, 1, 6).r(3, wx + 1, wy + 4, 8, 1);
    }
    if (B.sign){
      var sw = B.sign.length * 8 + 6, sx = Math.round((W - sw) / 2), sy = R - 13;
      p.r(3, sx, sy, sw, 12).r(0, sx + 1, sy + 1, sw - 2, 10);
      glyphTo(o.x, B.sign, sx + 3, sy + 2, 3);
    }
    if (kind === "house"){ p.r(3, W - 14, 2, 6, 10).r(1, W - 13, 3, 4, 8); }   // chimney

  });
});

      var dx = b.x + B.door, dy = b.y + B.h - 1;
      if (B.locked) M.locked.push({x: dx, y: dy, kind: b.kind});
      else { delete M.solidX[dx + "," + dy]; M.warps.push({x: dx, y: dy, to: b.to, tx: b.tx, ty: b.ty, dir: "up", door: 1}); }

// ── Input ─────────────────────────────────────────────────────────────────────
var KEYS = {}, PRESSED = {};
var KEYMAP = {ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right", w: "up", s: "down", a: "left", d: "right", W: "up", S: "down", A: "left", D: "right",
              z: "a", Z: "a", " ": "a", j: "a", J: "a", x: "b", X: "b", Backspace: "b", k: "b", K: "b", Shift: "b", Enter: "start", Escape: "start", Tab: "select"};
var TAPMARK = {};   // steps taken when each direction went down: a tap that took no step still gets one
function press(k){
  if (!KEYS[k]) PRESSED[k] = true; KEYS[k] = true;

  Snd.unlock();
}
function release(k){
  if (!KEYS[k]) return;

// Touch / mouse. Every pointer remembers which key it holds, so a lost touch can never leave a key stuck down.
var PTR = {};

function setDown(k, on){ var b = keyButton(k); if (b) b.classList.toggle("down", on); }
function ptrHold(id, k){
  if (PTR[id] === k) return;
  ptrLetGo(id);
  if (!k) return;
  PTR[id] = k; setDown(k, true); press(k);
}
function ptrLetGo(id){
  var k = PTR[id]; if (!k) return;
  delete PTR[id];

  setDown(k, false); release(k);
}
function releaseAll(){
  for (var id in PTR) ptrLetGo(id);
  KEYS = {}; W.queued = null;                         // leaving the app is not a tap
  Array.prototype.forEach.call(document.querySelectorAll("[data-k].down"), function(b){ b.classList.remove("down"); });
}
window.addEventListener("blur", releaseAll);
document.addEventListener("visibilitychange", function(){ if (document.hidden) releaseAll(); });
["pointerup", "pointercancel"].forEach(function(t){ document.addEventListener(t, function(e){ ptrLetGo(e.pointerId); }, true); });

// A, B, START, SELECT
Array.prototype.forEach.call(document.querySelectorAll(".ab [data-k], .ss [data-k]"), function(b){
  var k = b.dataset.k;
  b.addEventListener("pointerdown", function(e){ e.preventDefault(); try { b.setPointerCapture(e.pointerId); } catch (x) {} ptrHold(e.pointerId, k); });
  b.addEventListener("lostpointercapture", function(e){ ptrLetGo(e.pointerId); });
});

// The D-pad is one surface: the direction comes from where the thumb is, and sliding changes it.
(function(){
  var pad = document.querySelector(".dpad"), hit = pad && pad.querySelector(".dhit"), mine = {};
  if (!hit) return;
  function dirAt(e, cur){
    var r = pad.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    var ax = Math.abs(dx), ay = Math.abs(dy);
    if (ax * ax + ay * ay < Math.pow(r.width * 0.08, 2)) return cur || null;     // tiny dead zone in the middle
    var horiz = ax > ay;
    if (cur === "left" || cur === "right"){ if (ay < ax * 1.3) horiz = true; }      // a little stickiness near the diagonals
    else if (cur === "up" || cur === "down"){ if (ax < ay * 1.3) horiz = false; }
    return horiz ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
  }
  hit.addEventListener("pointerdown", function(e){
    e.preventDefault(); try { hit.setPointerCapture(e.pointerId); } catch (x) {}
    mine[e.pointerId] = 1; ptrHold(e.pointerId, dirAt(e, null));
  });
  hit.addEventListener("pointermove", function(e){
    if (!mine[e.pointerId]) return;
    if (e.pointerType === "mouse" && !e.buttons) return;
    ptrHold(e.pointerId, dirAt(e, PTR[e.pointerId]));
  });
  function end(e){ delete mine[e.pointerId]; ptrLetGo(e.pointerId); }
  hit.addEventListener("pointerup", end); hit.addEventListener("pointercancel", end); hit.addEventListener("lostpointercapture", end);
})();

// No zooming, magnifier or double-tap tricks on the console itself.
document.addEventListener("touchstart", function(e){ if (e.target.closest && e.target.closest(".pad, .ss")) e.preventDefault(); }, {passive: false});
var lastTouchEnd = 0;
document.addEventListener("touchend", function(e){
  var now = Date.now();

["gesturestart", "gesturechange", "dblclick"].forEach(function(t){
  document.addEventListener(t, function(e){ if (t !== "dblclick" || (e.target.closest && e.target.closest("#shell"))) e.preventDefault(); }, {passive: false});
});
function heldDir(){ return KEYS.up ? "up" : KEYS.down ? "down" : KEYS.left ? "left" : KEYS.right ? "right" : null; }
var DIRV = {up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0]};

// ── UI layers: dialogs and menus. Scripts await them. ────────────────────────
var UI = [];
var textSpeed = clamp(Number(store("wk_speed")) || 1, 0, 2);   // 0 slow 1 mid 2 fast
function wrap(s, width){
  var out = [];
  String(s).split("\n").forEach(function(par){
    var words = par.split(" "), line = "";
    words.forEach(function(w){
      while (w.length > width){ if (line){ out.push(line); line = ""; } out.push(w.slice(0, width)); w = w.slice(width); }
      if (!line) line = w; else if ((line + " " + w).length <= width) line += " " + w; else { out.push(line); line = w; }
    });
    out.push(line);
  });
  return out;
}
function fmt(s){ return String(s).replace(/\{NAME\}/g, SAVE ? SAVE.name : "YOU").replace(/\{RIVAL\}/g, "KAI"); }
// say(text): GB text box, two lines at a time, typewriter, ▼ to continue.
function say(text, opts){
  opts = opts || {};
  var lines = wrap(fmt(text), 18), i = 0;
  return new Promise(function(resolve){
    var L = {kind: "say", text: lines.join(" "), shown: 0, t: 0, line: 0, scroll: 0, keep: opts.keep,
      update: function(dt){
        var cps = [28, 60, 160][textSpeed] * (KEYS.a || KEYS.b ? 2.5 : 1);
        var page = lines.slice(i, i + 2).join(""), total = page.length;
        if (L.shown < total){ L.t += dt * cps; var before = Math.floor(L.shown); L.shown = Math.min(total, L.t); if (Math.floor(L.shown) > before && Math.floor(L.shown) % 2 === 0) Snd.sfx("text"); return; }
        if (PRESSED.a || PRESSED.b || (opts.auto && (L.wait = (L.wait || 0) + dt) > opts.auto)){
          if (i + 2 >= lines.length){ if (!opts.keep) UI.splice(UI.indexOf(L), 1); resolve(); }
          else { i += 2; L.shown = 0; L.t = 0; L.wait = 0; Snd.sfx("tick"); }
        }
      },
      draw: function(){
        box(0, 96, 160, 48);
        var a = lines[i] || "", b = lines[i + 1] || "", n = Math.floor(L.shown);
        txt(a.slice(0, n), 8, 104, 3); if (n > a.length) txt(b.slice(0, n - a.length), 8, 120, 3);
        if (n >= (a + b).length && !opts.auto && Math.floor(performance.now() / 400) % 2) txt("v", 144, 132, 3);
      }};
    UI.push(L);
  });
}
// menu(items): a GB list box with ▶ cursor. Resolves with the index, or -1 on B.
function menu(items, opts){
  opts = opts || {};
  var labels = items.map(function(it){ return typeof it === "string" ? it : it.label; });
  var w = opts.w || Math.max.apply(null, labels.map(function(l){ return l.length; })) * 8 + 24, rows = opts.rows || items.length;
  var h = rows * 16 + 8, x = opts.x != null ? opts.x : 160 - w, y = opts.y != null ? opts.y : 0;
  return new Promise(function(resolve){
    var L = {kind: "menu", items: labels, cur: clamp(opts.start || 0, 0, items.length - 1), off: 0,
      update: function(){
        if (PRESSED.up){ L.cur = (L.cur - 1 + items.length) % items.length; Snd.sfx("tick"); }
        if (PRESSED.down){ L.cur = (L.cur + 1) % items.length; Snd.sfx("tick"); }
        if (opts.onMove) opts.onMove(L.cur);
        if (L.cur < L.off) L.off = L.cur; if (L.cur >= L.off + rows) L.off = L.cur - rows + 1;
        if (PRESSED.a){ Snd.sfx("select"); if (!opts.keep) UI.splice(UI.indexOf(L), 1); resolve(L.cur); }
        else if ((PRESSED.b || (opts.startCloses && PRESSED.start)) && opts.cancel !== false){ Snd.sfx("tick"); UI.splice(UI.indexOf(L), 1); resolve(-1); }
      },
      draw: function(){
        box(x, y, w, h);
        for (var r = 0; r < rows && L.off + r < items.length; r++){
          var k = L.off + r, it = items[k], yy = y + 8 + r * 16;
          if (k === L.cur) txt(">", x + 8, yy, 3);
          txt(labels[k], x + 16, yy, it && it.dim ? 2 : 3);
          if (it && it.right) txt(it.right, x + w - 8 - it.right.length * 8, yy, 3);
        }
        if (L.off > 0) txt("^", x + w - 12, y + 2, 3);
        if (L.off + rows < items.length) txt("v", x + w - 12, y + h - 10, 3);
        if (opts.extra) opts.extra(L.cur);
      },
      close: function(){ var i = UI.indexOf(L); if (i >= 0) UI.splice(i, 1); }};
    UI.push(L);
    if (opts.handle) opts.handle(L);
  });
}
function ask(question, opts){ return say(question, {keep: true}).then(function(){ return menu(["YES", "NO"], {x: 112, y: 56, w: 48}); }).then(function(i){ UI.pop(); return i === 0; }); }

// ── World ─────────────────────────────────────────────────────────────────────
var scene = "boot";

  if (TILE_INFO[t] && TILE_INFO[t].solid) return true;

  if (pickupAt(x, y)) return true;
  if (M.locked.some(function(l){ return l.x === x && l.y === y; })) return true;
  var n = npcAt(x, y); if (n && n !== who) return true;
  if (who && W.x === x && W.y === y) return true;

}
function loadMap(id, x, y, dir){

  W.npcs = M.npcs.filter(function(n){ return !n.cond || n.cond(); }).map(function(n){ return {def: n, id: n.id, style: n.style, x: n.x, y: n.y, dir: n.dir, hx: n.x, hy: n.y, moving: false, t: 0, wt: 1 + Math.random() * 3}; });

}
function camera(){

}
var animT = 0;

  var M = W.map, cam = camera(), x0 = Math.floor(cam.x / 16), y0 = Math.floor(cam.y / 16);

    var t = tileAt(M, tx, ty);

  if (M.id === "hall"){   // the three charms on the table
    M.interacts.forEach(function(it){
      if (SAVE && (SAVE.flags.starter === it.sp || SAVE.flags.rival_sp === it.sp)) return;
      g.drawImage(ART.charm, Math.round(it.x * 16 - cam.x + 4), Math.round(it.y * 16 - cam.y + 3));
    });

  M.pickups.forEach(function(p){ if (!picked(p.id)) g.drawImage(ART.pouch, Math.round(p.x * 16 - cam.x), Math.round(p.y * 16 - cam.y)); });

  var actors = W.npcs.filter(function(n){ return !n.hidden; }).map(function(n){
    var k = n.moving ? n.t / n.dur : 0, v = DIRV[n.dir];
    return {style: n.style, dir: n.dir, wx: n.x * 16 + (n.moving ? v[0] * 16 * k : 0), wy: n.y * 16 + (n.moving ? v[1] * 16 * k : 0), walk: n.moving && k > .25 && k < .75, alt: n.alt, npc: n};
  });
  if (!W.hidePlayer){ var pk = W.moving ? W.t / W.dur : 0; actors.push({style: "player", dir: W.dir, wx: W.x * 16 + cam.ox, wy: W.y * 16 + cam.oy, walk: W.moving && pk > .25 && pk < .75, alt: W.alt, me: true}); }
  actors.sort(function(a, b){ return a.wy - b.wy; });
  actors.forEach(function(a){
    var sx = Math.round(a.wx - cam.x), sy = Math.round(a.wy - cam.y) - 4;
    var img = ART["p_" + a.style + "_" + a.dir + "_" + (a.walk ? 1 : 0)];
    if (a.walk && a.alt && (a.dir === "up" || a.dir === "down")){ g.save(); g.translate(sx + 16, sy); g.scale(-1, 1); g.drawImage(img, 0, 0); g.restore(); }
    else g.drawImage(img, sx, sy);
    var tx = Math.round(a.wx / 16), ty = Math.round(a.wy / 16);
    if (tileAt(M, tx, ty) === "," && Math.abs(a.wx - tx * 16) < 4 && Math.abs(a.wy - ty * 16) < 4) g.drawImage(ART.grass_over, 0, 8, 16, 8, Math.round(tx * 16 - cam.x), Math.round(ty * 16 - cam.y) + 8, 16, 8);
    if (a.npc && a.npc.bang) g.drawImage(ART.bang, sx + 3, sy - 13);
  });
}

// movement for the player and NPCs
function stepActors(dt){
  W.npcs.forEach(function(n){
    if (n.moving){ n.t += dt; if (n.t >= n.dur){ n.x = n.tx; n.y = n.ty; n.moving = false; n.alt = !n.alt; if (n.done){ var d = n.done; n.done = null; d(); } } return; }
    if (n.def.wander && !scriptDepth && !UI.length && scene === "world"){
      n.wt -= dt;
      if (n.wt <= 0){
        n.wt = 1.5 + Math.random() * 3;
        var dirs = ["up", "down", "left", "right"], d = dirs[Math.floor(Math.random() * 4)], v = DIRV[d];
        n.dir = d;
        var nx = n.x + v[0], ny = n.y + v[1];
        if (Math.abs(nx - n.hx) <= 2 && Math.abs(ny - n.hy) <= 2 && !blocked(nx, ny, n) && tileAt(W.map, nx, ny) !== ",") startNpcMove(n, d);
      }
    }
  });
}
function startNpcMove(n, d, dur){ var v = DIRV[d]; n.dir = d; n.tx = n.x + v[0]; n.ty = n.y + v[1]; n.moving = true; n.t = 0; n.dur = dur || .28; }
function walkNpc(n, d, steps){
  return new Promise(function(res){
    var left = steps;
    (function go(){ if (left-- <= 0){ res(); return; } startNpcMove(n, d); n.done = go; })();
  });
}
function facing(){ var v = DIRV[W.dir]; return {x: W.x + v[0], y: W.y + v[1]}; }

function worldUpdate(dt){
  W.turnT = Math.max(0, W.turnT - dt); W.bumpT = Math.max(0, W.bumpT - dt);
  if (W.moving){
    W.t += dt;
    if (W.t >= W.dur){ W.x = W.tx; W.y = W.ty; W.moving = false; W.alt = !W.alt; arrived(); }
    return;
  }
  if (scriptDepth || UI.length){ W.queued = null; return; }
  if (PRESSED.start){ W.queued = null; Snd.sfx("menu"); runScript(startMenu); return; }
  if (PRESSED.a){ W.queued = null; interact(); return; }
  var d = heldDir(), tap = false;
  if (!d && W.queued){ d = W.queued; tap = true; }     // a quick tap: turn if needed and take one step
  W.queued = null;
  if (!d) return;
  if (d !== W.dir){ W.dir = d; if (!tap){ W.turnT = .09; return; } }
  if (W.turnT > 0 && !tap) return;
  var v = DIRV[d], nx = W.x + v[0], ny = W.y + v[1];
  if (blocked(nx, ny)){ if (W.bumpT <= 0){ Snd.sfx("bump"); W.bumpT = .3; } return; }
  W.tx = nx; W.ty = ny; W.moving = true; W.t = 0; W.dur = KEYS.b ? .13 : .25; W.started++;
}
var saveTimer = 0;
function arrived(){
  W.steps++; W.sinceBattle++; saveTimer++;
  var M = W.map;
  var wp = M.warps.filter(function(w){ return w.x === W.x && w.y === W.y; })[0];
  if (wp){ runScript(function(){ return warp(wp); }); return; }
  var tr = M.triggers.filter(function(t){ return t.x === W.x && t.y === W.y; })[0];
  if (tr && SCRIPTS[tr.script]){ runScript(function(){ return SCRIPTS[tr.script](tr); }); return; }
  if (checkTrainers()) return;
  if (tileAt(M, W.x, W.y) === "," && M.encounters && hasStarter() && W.sinceBattle > 2 && Math.random() < 1 / 9){
    runScript(function(){ return wildBattle(); }); return;
  }
  if (saveTimer >= 25){ saveTimer = 0; savePos(); }
}
function savePos(){ if (!SAVE || scene !== "world") return Promise.resolve(); var fl = {}; for (var k in localFlags) fl[k] = true; return call("save", {map: W.map.id, x: W.x, y: W.y, dir: W.dir, flags: fl}).catch(function(){}); }
function fade(out, ms){
  return new Promise(function(res){ var t0 = performance.now(); FADE.on = true;
    (function f(){ var k = Math.min(1, (performance.now() - t0) / (ms || 280)); FADE.k = out ? k : 1 - k; if (k < 1) requestAnimationFrame(f); else { if (!out) FADE.on = false; res(); } })(); });
}
var FADE = {on: false, k: 0, ci: 0};
function warp(wp){
  Snd.sfx(wp.door || W.map.indoor ? "door" : "step");
  return fade(true).then(function(){
    loadMap(wp.to, wp.tx, wp.ty, wp.dir); W.sinceBattle = 3;
    return savePos();
  }).then(function(){ return fade(false); }).then(function(){ return onEnter(); });
}
function interact(){
  var f = facing(), M = W.map, t = tileAt(M, f.x, f.y);
  var n = npcAt(f.x, f.y);
  if (!n && TILE_INFO[t] && TILE_INFO[t].counter){ var v = DIRV[W.dir]; n = npcAt(f.x + v[0], f.y + v[1]); }
  if (n){ runScript(function(){ return talkTo(n); }); return; }
  var p = pickupAt(f.x, f.y); if (p){ runScript(function(){ return pickUp(p); }); return; }
  var s = M.signs.filter(function(s){ return s.x === f.x && s.y === f.y; })[0]; if (s){ runScript(function(){ return say(s.text); }); return; }
  var it = M.interacts.filter(function(s){ return s.x === f.x && s.y === f.y; })[0]; if (it && SCRIPTS[it.script]){ runScript(function(){ return SCRIPTS[it.script](it); }); return; }
  var tm = M.terminals.filter(function(s){ return s.x === f.x && s.y === f.y; })[0]; if (tm){ runScript(kinBox); return; }
  var lk = M.locked.filter(function(s){ return s.x === f.x && s.y === f.y; })[0];
  if (lk){ runScript(function(){ return say("The door is locked.\nA note reads: THE WARDEN IS AWAY IN THE MOUNTAINS."); }); return; }
  if (t === "b" && M.indoor){ runScript(function(){ return say(["Crammed full of books about kin.", "A book about the stars. The pages are dog-eared.", "A cookbook. Page 12 is just a stew recipe."][(f.x + f.y) % 3]); }); }
}
function talkTo(n){
  var d = n.def;
  if (!n.moving) n.dir = OPP[W.dir];
  if (d.trainer && !beaten(d.trainer)) return trainerBattle(n);
  if (d.trainer) return say(d.after.join("\n"));
  if (d.talk && SCRIPTS[d.talk]) return SCRIPTS[d.talk](n);
  return d.text.reduce(function(p, line){ return p.then(function(){ return say(line); }); }, Promise.resolve()).then(function(){ n.dir = d.dir; });
}
function itemName(id){ return (STATIC.items[id] || {name: id}).name.toUpperCase(); }

    if (!d.ok) return say(d.error || "There's nothing here.");
    Snd.jingle("item");
    return d.got.reduce(function(pr, it){ return pr.then(function(){ return say("{NAME} found " + itemName(it[0]) + (it[1] > 1 ? " x" + it[1] : "") + "!"); }); }, Promise.resolve());
  });

function lineOfSight(n){

    if (x === W.x && y === W.y) return i;
    if (blocked(x, y, n)) return 0;
  }
  return 0;
}
function checkTrainers(){

  for (var i = 0; i < W.npcs.length; i++){
    var n = W.npcs[i]; if (!n.def.trainer || beaten(n.def.trainer) || n.moving) continue;
    var dist = lineOfSight(n);
    if (dist){ runScript(function(){ return spotted(n, dist); }); return true; }

}

    .then(function(res){ if (!res.ok) return say(res.error || "They don't want to battle right now."); return runBattle(res); })

var Music = (function(){
  var NAMES = {C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11};
  function midi(n){ var m = /^([A-G])(#?)(-?\d)$/.exec(n); if (!m) return null; return 12 * (+m[3] + 1) + NAMES[m[1]] + (m[2] ? 1 : 0); }
  function parse(s){ return (s || "").trim().split(/\s+/).filter(Boolean).map(function(tok){ var p = tok.split(":"); return {n: p[0], len: +p[1] || 1}; }); }
  var parsed = {};
  Object.keys(TRACKS).forEach(function(k){ var T = TRACKS[k]; parsed[k] = {bpm: T.bpm, ch: ["lead", "harm", "bass", "drum"].map(function(c){ return parse(T[c]); })}; });
  var cur = null, want = null, timer = null, chans = null, sp = 0;
  function stop(){ cur = null; if (timer){ clearInterval(timer); timer = null; } }
  function start(name){
    var ctx = Snd.ctx; if (!ctx || !parsed[name]) return;
    stop(); cur = name; var T = parsed[name]; sp = 60 / T.bpm / 4;
    var t0 = ctx.currentTime + .08; chans = T.ch.map(function(list){ return {list: list, i: 0, t: t0}; });
    timer = setInterval(tick, 25); tick();
  }
  function tick(){
    var ctx = Snd.ctx; if (!ctx || !chans) return;
    var horizon = ctx.currentTime + .2;
    chans.forEach(function(c, ci){
      if (!c.list.length) return;
      while (c.t < horizon){
        var ev = c.list[c.i], d = ev.len * sp;
        if (ev.n !== "r"){
          if (ci === 3){
            if (ev.n === "k"){ Snd.tone(.5, 120, c.t, .12, .22, Snd.musBus, 45); }
            else if (ev.n === "s"){ Snd.noise(c.t, .12, .16, 1200, Snd.musBus); }
            else if (ev.n === "h"){ Snd.noise(c.t, .03, .06, 7000, Snd.musBus); }
          } else {
            var m = midi(ev.n);
            if (m != null){
              if (ci === 0) Snd.tone(.25, Snd.mtof(m), c.t, d * .9, .075, Snd.musBus, null, "flat");
              else if (ci === 1) Snd.tone(.5, Snd.mtof(m), c.t, d * .85, .035, Snd.musBus, null, "flat");
              else Snd.tone("tri", Snd.mtof(m), c.t, d * .92, .18, Snd.musBus, null, "flat");
            }
          }
        }
        c.t += d; c.i = (c.i + 1) % c.list.length;
      }
    });
  }
  return {
    play: function(name){ want = name; if (cur === name) return; if (Snd.ctx) start(name); },
    stop: function(){ want = null; stop(); },
    resume: function(){ if (want && cur !== want) start(want); }
  };
})();

function playEvents(evs){

      return menu(items, {x: 0, y: 0, w: 160, rows: 6}).then(function(i){
        if (i < 0) return kinBox();
        return call("box", {op: "withdraw", idx: i}).then(function(r){ return say(r.ok ? "Withdrew " + monName(SAVE.party[SAVE.party.length - 1]) + "." : r.error); }).then(kinBox);
      });
    }
    if (c === 1){
      if (SAVE.party.length <= 1) return say("You can't deposit your last kin!");
      return partyScreen({party: SAVE.party, prompt: "Deposit which kin?"}).then(function(i){
        if (i < 0) return kinBox();
        var name = monName(SAVE.party[i]);
        return call("box", {op: "deposit", idx: i}).then(function(r){ return say(r.ok ? name + " went into the KIN BOX." : r.error); }).then(kinBox);
      });
    }
  });
}

// ── Title, naming, boot ───────────────────────────────────────────────────────
var titleT = 0, titleMon = ["emberwyrm", "kelpling", "mandrakelet"][Math.floor(Math.random() * 3)];
function bigTxt(s, x, y, ci, sc){ for (var i = 0; i < s.length; i++) if (s[i] !== " ") g.drawImage(glyphCanvas(s.charCodeAt(i), ci), 0, 0, 8, 8, x + i * 8 * sc, y, 8 * sc, 8 * sc); }
function drawTitle(){
  fill(0, 0, 0, SW, SH);
  for (var y = 0; y < 52; y += 4) fill(1, 0, y, SW, 2);
  fill(3, 0, 50, SW, 2);
  bigTxt("WILDKIN", 24, 14, 3, 2); bigTxt("WILDKIN", 23, 13, 2, 2);
  txt("POCKET EDITION", 24, 36, 3);
  var bob = Math.round(Math.sin(titleT * 2.4) * 2);
  g.drawImage(monArt(titleMon, "front"), 56, 60 + bob);
  if (scene === "title" && !UI.length && Math.floor(titleT * 2) % 2 === 0) txt("PRESS START", 36, 118, 3);
  txt("(c)2026 DEGENERATES", 4, 134, 2);
}
var NAMING = null;
var NAME_ROWS = ["ABCDEFGHI", "JKLMNOPQR", "STUVWXYZ ", "012345678", "9-  DEL OK"];
function nameEntry(def){
  return new Promise(function(res){
    var name = (def || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 10), cx = 0, cy = 0;
    function cell(){ var row = NAME_ROWS[cy]; if (cy === 4){ if (cx >= 7) return "OK"; if (cx >= 4) return "DEL"; } return row[cx] || " "; }
    var L = {kind: "name", update: function(){
        if (PRESSED.left){ cx = (cx + 8) % 9; Snd.sfx("tick"); } if (PRESSED.right){ cx = (cx + 1) % 9; Snd.sfx("tick"); }
        if (PRESSED.up){ cy = (cy + 4) % 5; Snd.sfx("tick"); } if (PRESSED.down){ cy = (cy + 1) % 5; Snd.sfx("tick"); }
        if (PRESSED.b && name.length){ name = name.slice(0, -1); Snd.sfx("tick"); }
        if (PRESSED.start){ cx = 7; cy = 4; }
        if (PRESSED.a){
          var c = cell(); Snd.sfx("select");
          if (c === "OK"){ if (name.length){ UI.splice(UI.indexOf(L), 1); res(name); } }
          else if (c === "DEL") name = name.slice(0, -1);
          else if (c !== " " && name.length < 10) name += c;
        }
      },
      draw: function(){
        fill(0, 0, 0, SW, SH); txt("YOUR NAME?", 8, 8, 3); txt(name + (Math.floor(performance.now() / 400) % 2 ? "_" : ""), 24, 24, 3); fill(3, 24, 33, 80, 1);
        box(0, 44, 160, 100);
        for (var r = 0; r < 5; r++) for (var c = 0; c < 9; c++){
          var x = 16 + c * 15, y = 56 + r * 16, ch = NAME_ROWS[r][c];
          if (r === 4 && c >= 4){ if (c === 4) txt("DEL", x, y, 3); if (c === 7) txt("OK", x, y, 3); }
          else if (ch !== " ") txt(ch, x, y, 3);
          var sel = r === cy && (c === cx || (r === 4 && ((cx >= 7 && c === 7) || (cx >= 4 && cx < 7 && c === 4))));
          if (sel && (r !== 4 || c === 4 || c === 7)) txt(">", x - 8, y, 3);
        }
      }};
    UI.push(L);
  });
}
function titleFlow(){
  scene = "title"; Music.play("title");
  return new Promise(function(res){
    var L = {update: function(){ if (PRESSED.start || PRESSED.a){ UI.splice(UI.indexOf(L), 1); res(); } }, draw: function(){}};
    UI.push(L);
  }).then(function(){
    Snd.sfx("select");
    var items = SAVE ? ["CONTINUE", "OPTION"] : ["NEW GAME", "OPTION"];
    return menu(items, {x: 0, y: 0, w: 112, cancel: false}).then(function(i){
      if (i === 1) return options().then(titleFlow);
      return SAVE ? continueGame() : newGame();
    });
  });
}
function newGame(){
  scene = "intro"; Music.play("home");
  return say("ELDER ROWAN: Hello there! Welcome to the valley.")
    .then(function(){ return say("Creatures called KIN live in every field, river and cave around here."); })
    .then(function(){ return say("Some folks raise them as partners. Some battle with them. I've spent my whole life studying them."); })
    .then(function(){ return say("Now, tell me. What's your name?"); })
    .then(function(){ return nameEntry(DEFAULT_NAME); })
    .then(function(name){ return call("new", {name: name}); })
    .then(function(r){
      if (!r.ok){ toast(r.error || "Couldn't start a new game."); return boot(); }
      return say("Right! So your name is {NAME}!").then(function(){ return say("{NAME}, your very own adventure is about to begin. A world of KIN awaits!"); })
        .then(function(){ return fade(true, 500); }).then(function(){ loadMap(SAVE.map, SAVE.x, SAVE.y, SAVE.dir); scene = "world"; return fade(false, 500); }).then(onEnter);
    });
}
function continueGame(){
  return fade(true, 300).then(function(){ loadMap(SAVE.map, SAVE.x, SAVE.y, SAVE.dir); scene = "world"; return fade(false, 300); })
    .then(function(){ if (SAVE.battle) return resumeBattle(); return onEnter(); });
}
var DEFAULT_NAME = "";
function boot(){
  scene = "boot";
  return api("/api/games/wildkin/info").then(function(d){
    if (!d || d.ok === false){ toast((d && d.error) || "Couldn't load Wildkin."); return; }
    STATIC = d.static; SAVE = d.save; DEFAULT_NAME = d.default_name || ""; setBal(d.balance);
    $("led").classList.add("on");
    return runScript(titleFlow);
  }).catch(function(e){ if (e.message !== "login") toast("Couldn't reach the server."); });
}

// ── Main loop ─────────────────────────────────────────────────────────────────
var lastT = performance.now();
function frame(now){
  var dt = Math.min(.05, (now - lastT) / 1000); lastT = now; animT += dt; titleT += dt;
  if (UI.length) UI[UI.length - 1].update(dt);
  if (scene === "world"){ stepActors(dt); worldUpdate(dt); }
  // draw
  if (scene === "title" || scene === "boot") drawTitle();
  else if (scene === "intro"){ fill(0, 0, 0, SW, SH); var im = ART.p_elder_down_0; g.drawImage(im, 0, 0, 16, 16, 20, 36, 32, 32); g.fillStyle = P[1]; g.beginPath(); g.ellipse(36, 70, 18, 3, 0, 0, 7); g.fill(); g.drawImage(monArt(titleMon, "front"), 84, 24 + Math.round(Math.sin(titleT * 2.4) * 2)); }
  else if (scene === "battle") drawBattle();
  else if (scene === "world"){ drawWorld(); drawPortrait(); }
  for (var i = 0; i < UI.length; i++) UI[i].draw();
  if (FADE.on && FADE.k > 0){ var k = Math.round(FADE.k * 3) / 3; g.globalAlpha = k; fill(0, 0, 0, SW, SH); g.globalAlpha = 1; }
  PRESSED = {};
  requestAnimationFrame(frame);
}
buildArt();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){});
requestAnimationFrame(frame);
boot();
window.__wk = {path: function(tx, ty){
  var M = W.map, start = W.x + "," + W.y, goal = tx + "," + ty, prev = {}, q = [[W.x, W.y]]; prev[start] = null;
  while (q.length){ var c = q.shift(), k = c[0] + "," + c[1]; if (k === goal) break;
    ["up", "down", "left", "right"].forEach(function(d){ var v = DIRV[d], nx = c[0] + v[0], ny = c[1] + v[1], nk = nx + "," + ny;
      if (nk in prev || nx < 0 || ny < 0 || nx >= M.w || ny >= M.h) return;
      if (nk !== goal && blocked(nx, ny)) return;
      var isWarp = M.warps.some(function(w){ return w.x === nx && w.y === ny; }); if (isWarp && nk !== goal) return;
      prev[nk] = [k, d]; q.push([nx, ny]); }); }
  if (!(goal in prev)) return null; var out = [], cur = goal; while (prev[cur]){ out.unshift(prev[cur][1]); cur = prev[cur][0]; } return out; },
  top: function(){ var L = UI[UI.length - 1]; return L ? {kind: L.kind || "?", text: L.text || "", items: L.items || null, cur: L.cur} : null; }, W: W, get B(){ return B; }, get SAVE(){ return SAVE; }, get KEYS(){ return KEYS; }, get scene(){ return scene; }, get UI(){ return UI; }, press: press, release: release, MAPS: MAPS, monArt: monArt, ART: ART};
})();
</script>
